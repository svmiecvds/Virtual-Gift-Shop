<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coming Soon — The Gifting Co.</title>
    <link rel="icon" type="image/png" href="assets/favicon.webp">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: url('assets/bg.webp') center / cover no-repeat fixed;
            background-color: #fce7f3;
            font-family: 'Fredoka', sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.88);
            padding: 48px 36px 40px;
            border-radius: 28px;
            box-shadow: 0 16px 48px rgba(183, 26, 61, 0.18);
            border: 1.5px solid rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 340px;
            width: 92%;
            text-align: center;
        }

        h1 {
            color: #B71A3D;
            font-size: 62px;
            font-family: 'Pinyon Script', cursive;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            font-weight: 500;
        }

        footer {
            position: fixed;
            bottom: 18px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.75);
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Coming Soon</h1>
        <p>on your Mobile browsers!</p>
    </div>
    <footer>© 2026 | The Gifting Co.</footer>
</body>
</html>
