<html lang="en">

<head>
    <meta name="color-scheme" content="light">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

        /* --- THEME VARIABLES --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fce0e5 0%, #fac5cf 40%, #fac5cf 100%);
            --body-bg: #fef2f4;
            --panel-bg: #fce0e5;
            --popup-bg: #fce0e5;
            --receipt-bg: #fef2f4;
            --card-bg: #ffffff;
            --text-color: #B71A3D;
            --heading-color: #B71A3D;
            --btn-bg: #ffffff;
            --btn-text: #B71A3D;
            --cart-btn-bg: #B71A3D;
            --cart-btn-shadow: #B71A3D;
            --glow-color: #B71A3D;
            --glow-soft: #fac5cf;
            --toast-bg: #B71A3D;
            --receipt-shadow: #fac5cf;
            --shelf-overlay: rgba(255, 255, 255, 0.0);
        }



        /* --- BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-width: none;
            background-color: #fef2f4;
            /* prevent white overscroll on iOS */
        }

        html::-webkit-scrollbar {
            display: none;
        }



        html::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -999;
            background-image: url('assets/giftbg.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
        }

        body,
        body.receiptPage,
        body.giftPage {
            color: var(--text-color);
            background: transparent !important;
            overflow: hidden !important;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
            font-family: 'Fredoka', 'Pacifico', cursive, sans-serif;
        }

        .checkoutTitle,
        .giftHeader {
            text-align: center !important;
            margin-top: 100px !important;
            margin-bottom: 20px !important;
            color: #B71A3D !important;
            font-family: 'Pinyon Script', cursive !important;
            font-size: 56px !important;
            text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4) !important;
            font-weight: bold !important;
            line-height: 1.2 !important;
        }

        .hidden-h1-spacer {
            visibility: hidden;
            pointer-events: none;
            text-align: center;
            margin-top: 100px;
            margin-bottom: 20px;
            font-size: 56px;
            line-height: 1.2;
            font-family: 'Pinyon Script', cursive;
            font-weight: bold;
        }





        /* --- CHECKOUT BUTTON --- */


        /* --- Highlight selected gift element --- */
        .gifSelected {
            outline: 3px solid #B71A3D !important;
            outline-offset: 3px;
        }

        /* --- Gift text element --- */
        .giftText {
            min-width: 80px;
            font-size: 22px;
            color: var(--heading-color);
            user-select: none;
            cursor: move;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note {
            width: 260px;
        }

        .note img {
            width: 100%;
        }

        .noteText {
            position: absolute;
            top: 12%;
            left: 10%;
            width: 75%;
            height: 70%;
            overflow: hidden;
            text-align: center;
            word-wrap: break-word;
            font-size: 18px;
        }


        /* --- NAVBAR --- */
        #storeNavbar {
            background: #900C3F;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 30px;
            z-index: 999;
            border-bottom: 3px solid #fac5cf;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.1);
            padding: 10px 30px;
            box-sizing: border-box;
        }











        /* --- PEARL STARDUST BUTTON DESIGN --- */
        :root {
            --bg-pink: #fac5cf;
            --hover-glow: rgba(250, 197, 207, 0.6);
            --hover-glow-soft: rgba(183, 26, 61, 0.8);
            --btn-text-color: #5a0035;
        }



        .shiny-cta {
            outline: none;
            cursor: pointer;
            border: 0;
            position: relative;
            border-radius: 100px;
            background-color: var(--bg-pink);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -2px rgba(183, 26, 61, 0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 10px 24px;
        }

        .shiny-cta span {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            color: var(--btn-text-color);
        }

        .shiny-cta:hover {
            filter: brightness(1.05);
            box-shadow: 0 6px 12px rgba(255, 105, 180, 0.3);
        }

        .shiny-cta:active {
            transform: scale(0.98);
        }


        /* --- NAV BRAND --- */
        .navBrand,
        a.navBrand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            font-family: 'Pinyon Script', cursive;
            font-size: 38px;
            color: white;
            text-decoration: none;
            text-shadow: none;
        }

        .navBrand:hover {
            transform: translateX(-50%) scale(1.08);
        }

        /* --- SHARE BUTTON --- */
        .share-btn-container {
            position: fixed;
            top: 90px;
            right: 30px;
            z-index: 1000;
        }

        /* --- SHARE MODAL OVERLAY --- */
        .share-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .share-modal-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .share-modal {
            background: var(--popup-bg);
            border: 2px solid var(--glow-soft);
            border-radius: 28px;
            padding: 32px 36px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.25);
            text-align: center;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .share-modal-overlay.visible .share-modal {
            transform: scale(1) translateY(0);
        }

        .share-modal h3 {
            font-family: 'Pinyon Script', cursive;
            color: var(--heading-color);
            font-size: 26px;
            margin-bottom: 8px;
        }

        .share-modal p {
            color: var(--text-color);
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .share-url-box {
            display: flex;
            align-items: stretch;
            gap: 0;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--glow-soft);
            background: var(--card-bg);
            margin-bottom: 20px;
        }

        .share-url-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 16px;
            font-family: 'Fredoka', sans-serif;
            font-size: 14px;
            color: var(--text-color);
            outline: none;
            min-width: 0;
        }

        .share-url-box button {
            border: none;
            background: var(--bg-pink);
            color: var(--btn-text-color);
            padding: 14px 20px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .share-url-box button:hover {
            filter: brightness(1.1);
        }

        .share-modal-close {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
            position: absolute;
            top: 16px;
            right: 20px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .share-modal-close:hover {
            opacity: 1;
        }

        .share-modal {
            position: relative;
        }

        /* Spinner inside share button */
        .share-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid var(--btn-text-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spinShare 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spinShare {
            to {
                transform: rotate(360deg);
            }
        }

        /* Toast notification */
        .share-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--toast-bg);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
            z-index: 10001;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .share-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* --- Share buttons row inside modal --- */
        .share-social-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 8px;
        }

        .share-social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--glow-soft);
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }


        .share-social-btn:hover {
            background: var(--bg-pink);
            transform: translateY(-3px) scale(1.08);
        }

        body.viewer-mode .checkoutTitle {
            margin-top: 30px;
            font-size: 36px;
            font-weight: bold;
        }

        body.viewer-mode {
            padding-bottom: 40px !important;
        }

        .viewer-badge {
            text-align: center;
            margin-top: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 13px;
            color: var(--text-color);
            opacity: 0.5;
        }

        .viewer-badge a {
            color: var(--heading-color);
            text-decoration: none;
            font-weight: 600;
        }

        .viewer-badge a:hover {
            text-decoration: underline;
        }

        .nav-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--heading-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Fredoka', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            height: 38px;
            padding: 0 18px;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .nav-action-btn:hover {
            opacity: 0.85;
            transform: translateY(-2px);
        }

        /* New Envelope Animation Styles */
        .envelope-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #5c0017;
            /* dark red */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .envelope-full {
            cursor: pointer;
            position: relative;
            width: 90%;
            max-width: 600px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .envelope-full:hover {
            transform: scale(1.03);
        }

        .envelope-full img,
        .env-top,
        .env-bottom {
            width: 100%;
            height: auto;
            display: block;
        }

        .envelope-parts {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            pointer-events: none;
            display: none;
            z-index: 1;
        }

        .env-top,
        .env-bottom {
            position: absolute;
            left: 0;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.2s ease;
        }

        /* Initial positions - they overlay exactly */
        .env-top {
            top: 0;
            transform: translateY(-50%);
        }

        .env-bottom {
            top: 0;
            transform: translateY(-50%);
        }

        /* Animation states */
        .env-top.open {
            transform: translateY(-150%);
            opacity: 0;
        }

        .env-bottom.open {
            transform: translateY(50%);
            opacity: 0;
        }

        .envelope-overlay.fading {
            opacity: 0;
            pointer-events: none;
        }

        .env-instruction {
            position: absolute;
            bottom: -40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            opacity: 0.8;
            pointer-events: none;
        }


        @media (min-width: 769px) {
            .envelope-overlay {
                background: transparent !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .envelope-full,
            .envelope-parts {
                width: 100vw;
                max-width: 100vw;
                height: 100vh;
                top: 0;
                left: 0;
                transform: none;
            }

            .envelope-full img,
            .env-top,
            .env-bottom {
                width: 100vw;
                height: 100vh;
                object-fit: fill;
            }

            .env-top,
            .env-bottom {
                top: 0;
                transform: none;
            }

            .env-top.open {
                transform: translateY(-100%);
                opacity: 0;
            }

            .env-bottom.open {
                transform: translateY(100%);
                opacity: 0;
            }

            .envelope-full:hover {
                transform: none;
            }

            .env-instruction {
                bottom: 20px;
                font-size: 24px;
            }
        }
    </style>

    <!-- Exact spacer matching gift.html h1 to perfectly align background layout -->

    <!-- Display the stationary gift layout exactly like gift.html -->

        style="display: flex; flex: 1; min-height: 0; align-items: center; gap: 20px; justify-content: center; width: 85%; max-width: 900px; margin: 0 auto; padding-top: 10px; padding-bottom: 20px; position: relative; z-index: 10;">
        <div id="giftScene" style="flex: 1; position: relative; overflow: visible; min-height: 300px; height: 55vh;">
            <!-- Arranged elements will be reconstructed here dynamically -->
        </div>
    </div>


    <!-- Dynamic Warning Banner "Click on your gifts!" will be appended here by JS if voice note exists -->


    <script defer>
        const giftScene = document.getElementById("giftScene");

        function resolveMainSrc(src) {
            if (!src) return "";
            if (src.startsWith("data:")) return src;
            let path = src.replace(/\\/g, "/");
            const assetsIndex = path.toLowerCase().indexOf("assets/");
            if (assetsIndex !== -1) {
                const p = path.substring(assetsIndex);
                return p.startsWith("/") ? p.substring(1) : p;
            }
            return src;
        }

        function resolveAccessorySrc(src) {
            if (!src) return "";
            let path = src.replace(/\\/g, "/");
            const assetsIndex = path.toLowerCase().indexOf("assets/");
            if (assetsIndex !== -1) {
                return path.substring(assetsIndex);
            }
            const filename = path.split("/").pop();
            if (filename.includes("custom")) {
                return "assets/plushies/" + filename;
            } else if (filename.includes("flower") || filename.includes("bow") || filename.includes("holder")) {
                return "assets/flowers/" + filename;
            }
        }

        /* ---------- VIEWER MODE DETECTION ---------- */
        // Check if the URL contains shared gift data in the hash
        let isViewerMode = false;
        let savedLayout = [];

        (function detectSharedGift() {
            const hash = window.location.hash;
            if (hash.startsWith('#gift=')) {
                try {
                    const compressed = hash.substring(6); // remove '#gift='
                    const json = LZString.decompressFromEncodedURIComponent(compressed);
                    if (json) {
                        savedLayout = JSON.parse(json);
                        isViewerMode = true;
                        document.body.classList.add('viewer-mode');
                        // Change title for viewer
                        const titleEl = document.querySelector('.checkoutTitle');
                        if (titleEl) titleEl.textContent = 'A Gift For You ';
                    }
                } catch (e) {
                    console.error('Failed to decode shared gift data:', e);
                }
            }
            // Fallback to localStorage if no shared data
            if (!savedLayout.length) {
                savedLayout = JSON.parse(sessionStorage.getItem("savedGiftLayout")) || [];
            }
        })();



        // === PLACEMENT (percentage-based for mobile correctness) ===
        savedLayout.forEach(item => {
            const wrapper = document.createElement("div");
            wrapper.className = "giftEl";
            wrapper.style.position = "absolute";

            if (item.leftPct !== undefined && item.topPct !== undefined) {
                // New format: percentage positions — renders identically on any screen size
                wrapper.style.left = item.leftPct + "%";
                wrapper.style.top = item.topPct + "%";
                if (item.widthPct) wrapper.style.width = item.widthPct + "%";
                if (item.heightPct !== null && item.heightPct !== undefined) {
                    wrapper.style.height = item.heightPct + "%";
                } else if (item.height === "auto") {
                    wrapper.style.height = "auto";
                }
            } else {
                // Legacy format (old shared links) — fall back to scale math
                const currentSceneW = giftScene.offsetWidth;
                const currentSceneH = giftScene.offsetHeight;
                const origSceneW = item.sceneW || 900;
                const origSceneH = item.sceneH || 550;
                const scaleX = currentSceneW / origSceneW;
                const scaleY = currentSceneH / origSceneH;
                let origLeft = (item.centerOffset !== undefined) ? (origSceneW / 2 + item.centerOffset) : (parseFloat(item.left) || 0);
                let origTop = parseFloat(item.top) || 0;
                wrapper.style.left = (origLeft * scaleX) + "px";
                wrapper.style.top = (origTop * scaleY) + "px";
                if (item.width) wrapper.style.width = (parseFloat(item.width) * scaleX) + "px";
                if (item.height && item.height !== "auto") wrapper.style.height = (parseFloat(item.height) * scaleY) + "px";
            }

            wrapper.style.zIndex = item.zIndex;
            wrapper.style.transform = `rotate(${item.rotation || 0}deg) scaleX(${item.flip || 1})`;

            // scaleX/scaleY of 1 for content rendering since we now use % positioning
            renderGiftItemContents(wrapper, item);
            giftScene.appendChild(wrapper);
        });


        // Reusable function to render the actual item contents
        function renderGiftItemContents(wrapper, item) {
            if (item.type === "plushie" || item.type === "flower") {
                const isBouquet = item.isBouquet === true || (item.src && item.src.startsWith("data:image")) || (item.image && item.image.startsWith("data:image"));

                // Base plushie image
                const img = document.createElement("img");
                img.src = resolveMainSrc(item.src);
                const hasAccessories = item.accessories && item.accessories.length > 0;
                if (isBouquet || item.canvasW !== undefined) {
                    // Bouquets and canvas-based items need absolute positioning inside a sized container
                    img.style.position = "absolute";
                    img.style.width = "100%";
                    img.style.height = "100%";
                    img.style.objectFit = "contain";
                    img.style.left = "0";
                    img.style.top = "0";
                } else if (hasAccessories) {
                    // Regular plushies WITH accessories: use block so wrapper gets natural height,
                    // enabling percentage-based accessory positioning to work correctly.
                    img.style.position = "relative";
                    img.style.width = "100%";
                    img.style.height = "auto";
                    img.style.display = "block";
                    // Ensure accessories peeking outside the plushie bounds are not clipped
                    wrapper.style.overflow = "visible";
                } else {
                    // Regular plushies without accessories: absolute is fine
                    img.style.position = "absolute";
                    img.style.width = "100%";
                    img.style.height = "auto";
                    img.style.left = "0";
                    img.style.top = "0";
                }
                img.draggable = false;
                wrapper.appendChild(img);

                // Reconstruct overlays (accessories)
                if (item.accessories && item.accessories.length > 0) {
                    let canvasW = isBouquet ? 600 : 280;
                    let canvasH = canvasW;
                    let canvasL = isBouquet ? 0 : 210;
                    let canvasT = isBouquet ? 0 : 210;

                    if (item.canvasW !== undefined) {
                        canvasW = item.canvasW;
                        canvasH = item.canvasH;
                        canvasL = item.canvasL;
                        canvasT = item.canvasT;
                    }

                    item.accessories.forEach(acc => {
                        const accessory = document.createElement("img");
                        let src = acc.image;
                        if (src) {
                            src = resolveAccessorySrc(src);
                        }
                        accessory.src = src;
                        accessory.style.position = "absolute";
                        accessory.style.pointerEvents = "none";

                        const rawLeft = parseFloat(acc.left);
                        const rawTop = parseFloat(acc.top);
                        const rawWidth = parseFloat(acc.width);

                        let adjustedLeft = rawLeft;
                        let adjustedTop = rawTop;
                        if (item.canvasW === undefined && isBouquet) {
                            adjustedLeft = rawLeft - 50;
                            adjustedTop = rawTop - 50;
                        } else if (item.canvasW === undefined && !isBouquet) {
                            adjustedLeft = rawLeft - 210;
                            adjustedTop = rawTop - 210;
                        } else {
                            adjustedLeft = rawLeft - canvasL;
                            adjustedTop = rawTop - canvasT;
                        }
                        accessory.style.left = ((adjustedLeft / canvasW) * 100) + "%";
                        accessory.style.top = ((adjustedTop / canvasH) * 100) + "%";
                        accessory.style.width = ((rawWidth / canvasW) * 100) + "%";

                        if (item.accessories.indexOf(acc) === 0 && !isBouquet && item.canvasW !== undefined) {
                            accessory.style.height = "auto";
                            accessory.style.display = "block";
                        } else {
                            if (acc.height) {
                                const rawHeight = parseFloat(acc.height);
                                accessory.style.height = ((rawHeight / canvasH) * 100) + "%";
                                accessory.style.objectFit = "contain";
                            } else if (isBouquet) {
                                accessory.style.height = "auto";
                                accessory.style.objectFit = "contain";
                            }
                        }

                        accessory.style.transform = `rotate(${acc.rotation || 0}deg) scaleX(${acc.flip || 1})`;
                        wrapper.appendChild(accessory);
                    });
                }
            }
            else if (item.type === "note") {
                const paper = document.createElement("img");
                paper.src = resolveMainSrc(item.src);
                paper.style.width = "100%";
                paper.style.display = "block";
                paper.draggable = false;
                wrapper.appendChild(paper);
                wrapper.className = "note giftEl";

                wrapper.style.containerType = "inline-size";
                wrapper.style.aspectRatio = "1 / 1";

                if (item.noteTextDetails) {
                    const textDiv = document.createElement("div");
                    textDiv.className = "noteText";
                    textDiv.innerText = item.noteTextDetails.text;
                    textDiv.style.fontFamily = item.noteTextDetails.fontFamily;
                    textDiv.style.color = item.noteTextDetails.color;

                    if (item.noteTextDetails.left !== undefined) {
                        textDiv.style.position = "absolute";
                        textDiv.style.left = item.noteTextDetails.left + "%";
                        textDiv.style.top = item.noteTextDetails.top + "%";
                        textDiv.style.width = item.noteTextDetails.width ? (item.noteTextDetails.width + "%") : "60%";

                        let flipStr = item.noteTextDetails.flip == "-1" ? "scaleX(-1) " : "";
                        textDiv.style.transform = `translate(-50%, -50%) ${flipStr}rotate(${item.noteTextDetails.angle || 0}rad) scale(${item.noteTextDetails.scale || 1})`;

                        const savedHeight = item.noteTextDetails.height ? (item.noteTextDetails.height + "%") : "60%";
                        textDiv.style.height = savedHeight;
                        textDiv.style.maxHeight = savedHeight;
                        textDiv.style.overflow = "hidden";
                        textDiv.style.whiteSpace = "pre-wrap";
                        textDiv.style.wordBreak = "break-word";
                        textDiv.style.textAlign = "center";
                        textDiv.style.lineHeight = "1.2";
                        // Use saved fontSize (% of note paper width) so it scales correctly with the wrapper.
                        // Fall back to 3.8cqw only if no fontSize was saved.
                        if (item.noteTextDetails.fontSize) {
                            textDiv.style.fontSize = item.noteTextDetails.fontSize + "cqw";
                        } else {
                            textDiv.style.fontSize = "3.8cqw";
                        }
                    }

                    wrapper.appendChild(textDiv);
                }

                if (item.stickers) {
                    item.stickers.forEach(st => {
                        const stickerImg = document.createElement("img");
                        stickerImg.src = resolveMainSrc(st.src);
                        stickerImg.style.position = "absolute";
                        stickerImg.style.left = st.left + "%";
                        stickerImg.style.top = st.top + "%";
                        stickerImg.style.width = st.width + "%";
                        stickerImg.style.transform = `translate(-50%, -50%) rotate(${st.angle || 0}rad) scale(${st.scale || 1})`;
                        stickerImg.style.pointerEvents = "none";
                        wrapper.appendChild(stickerImg);
                    });
                }
            }
            else if (item.type === "sticker") {
                const img = document.createElement("img");
                img.src = resolveMainSrc(item.src);
                img.style.width = "100%";
                img.draggable = false;
                wrapper.appendChild(img);
            }
            else if (item.type === "text") {
                wrapper.className = "giftEl giftText";
                wrapper.innerText = item.text;
                wrapper.style.fontFamily = item.fontFamily;

                wrapper.style.fontSize = (parseFloat(item.fontSize) || 22) + "px";

                wrapper.style.color = item.color;
                wrapper.style.userSelect = "none";
            }

        }


        // In viewer mode, add a small badge at the bottom
        if (isViewerMode) {
            const badge = document.createElement('div');
            badge.className = 'viewer-badge';
            badge.innerHTML = 'Made with  <a href="index.html">The Gifting Co.</a>';
            document.body.appendChild(badge);
        }

        // Share functionality
        const shareBtn = document.getElementById("shareGiftBtn");
        const shareBtnMobile = document.getElementById("shareGiftBtnMobile");
        const shareModal = document.getElementById("shareModal");
        const closeShareModal = document.getElementById("closeShareModal");
        const shareStep1 = document.getElementById("shareStep1");
        const shareStep2 = document.getElementById("shareStep2");
        const recipientNameInput = document.getElementById("recipientNameInput");
        const generateLinkBtn = document.getElementById("generateLinkBtn");
        const shareUrlInput = document.getElementById("shareUrlInput");
        const copyShareBtn = document.getElementById("copyShareBtn");

        function openShareModal() {
            if (isViewerMode) return;
            shareStep1.style.display = 'block';
            shareStep2.style.display = 'none';
            recipientNameInput.value = '';
            shareModal.classList.add("visible");
            recipientNameInput.focus();
        }
        window.openShareModal = openShareModal;

        if (shareBtn) shareBtn.addEventListener("click", openShareModal);
        if (shareBtnMobile) shareBtnMobile.addEventListener("click", openShareModal);

        if (generateLinkBtn) {
            generateLinkBtn.addEventListener("click", async () => {
                const name = recipientNameInput.value.trim();
                if (!name) {
                    alert("Please enter a name.");
                    return;
                }

                const span = generateLinkBtn.querySelector("span");
                const originalText = span ? span.innerText : "Generate Link";
                if (span) span.innerText = "Generating...";
                generateLinkBtn.style.pointerEvents = "none";

                try {
                    const response = await fetch('/api/saveGift', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            components: savedLayout,
                            recipientName: name
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Failed to generate link');
                    }

                    const data = await response.json();
                    const shareUrl = window.location.origin + '/result.html?id=' + data.id;

                    shareUrlInput.value = shareUrl;
                    shareStep1.style.display = 'none';
                    shareStep2.style.display = 'block';
                } catch (e) {
                    console.error("Error generating link:", e);
                    alert("Failed to generate link. Please try again.");
                } finally {
                    if (span) span.innerText = originalText;
                    generateLinkBtn.style.pointerEvents = "auto";
                }
            });
        }

        if (closeShareModal) {
            closeShareModal.addEventListener("click", () => {
                shareModal.classList.remove("visible");
                copyShareBtn.innerText = "Copy";
            });
        }

        if (copyShareBtn) {
            copyShareBtn.addEventListener("click", () => {
                shareUrlInput.select();
                shareUrlInput.setSelectionRange(0, 99999);
                navigator.clipboard.writeText(shareUrlInput.value).then(() => {
                    copyShareBtn.innerText = "Copied!";
                    setTimeout(() => {
                        copyShareBtn.innerText = "Copy";
                    }, 2000);
                });
            });
        }

        window.addEventListener("click", (e) => {
            if (e.target === shareModal) {
                shareModal.classList.remove("visible");
                copyShareBtn.innerText = "Copy";
            }
        });


    </script>

    <style>
        #giftScene {
            background: transparent !important;
            backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
        }
    </style>




    <script>
        // New Envelope Animation Logic
        const envelopeOverlay = document.getElementById("envelope-overlay");
        const envelopeFull = document.getElementById("envelopeFull");
        const envelopeParts = document.getElementById("envelopeParts");
        const envTop = document.getElementById("envTop");
        const envBottom = document.getElementById("envBottom");
        const envInstruction = document.getElementById("envInstruction");

        if (envelopeFull && envelopeOverlay) {
            let isOpening = false;

            function triggerOpen() {
                if (isOpening) return;
                isOpening = true;

                if (envInstruction) envInstruction.style.opacity = '0';

                // Subtle press feedback
                envelopeFull.style.transform = 'scale(0.97)';

                setTimeout(() => {
                    // Hide full envelope, show parts
                    envelopeFull.style.display = "none";
                    envelopeParts.style.display = "block";

                    // Trigger reflow
                    void envelopeParts.offsetWidth;

                    // Animate halves
                    envTop.classList.add("open");
                    envBottom.classList.add("open");

                    // Fade out overlay
                    setTimeout(() => {
                        envelopeOverlay.classList.add("fading");

                        // Remove completely
                        setTimeout(() => {
                            envelopeOverlay.remove();
                            document.body.classList.remove("env-opening");
                        }, 800);
                    }, 800);
                }, 150);
            }

            envelopeFull.addEventListener("click", triggerOpen);
            envelopeFull.addEventListener("touchend", (e) => {
                e.preventDefault();
                triggerOpen();
            });
        }
    </script>

</body>
