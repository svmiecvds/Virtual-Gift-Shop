        /* --- THEME VARIABLES --- */
        :root {
            --bg-gradient: linear-gradient(135deg, #fce0e5 0%, #fac5cf 40%, #fac5cf 100%);
            --body-bg: #fef2f4;
            --panel-bg: #fce0e5;
            --popup-bg: #fce0e5;
            --receipt-bg: #fef2f4;
            --card-bg: #ffffff;
            --text-color: #B71A3D;
            --heading-color: #B71A3D;
            --btn-bg: #ffffff;
            --btn-text: #B71A3D;
            --cart-btn-bg: #B71A3D;
            --cart-btn-shadow: #B71A3D;
            --glow-color: #B71A3D;
            --glow-soft: #fac5cf;
            --toast-bg: #B71A3D;
            --receipt-shadow: #fac5cf;
            --shelf-overlay: rgba(255, 255, 255, 0.0);
            --font-body: 'Quicksand', sans-serif;
            --font-heading: 'Pinyon Script', cursive;
            --font-ui: 'Fredoka', sans-serif;
            --font-nav: 'Inter', sans-serif;
        }



        /* --- BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scrollbar-width: none;
            background-color: #fef2f4;
            /* prevent white overscroll on iOS */
        }

        html::-webkit-scrollbar {
            display: none;
        }



        html::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -999;
            background-image: url('assets/giftbg.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
        }

        body,
        body.receiptPage,
        body.giftPage {
            color: var(--text-color);
            background: transparent !important;
            overflow: hidden !important;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.5s ease, color 0.5s ease;
            font-family: var(--font-body);
            font-weight: 500;
        }




        /* --- GIFT PAGE --- */

        #giftContainer {
            display: flex;
            flex: 1;
            min-height: 0;
            align-items: center;
            gap: 20px;
            justify-content: center;
            width: 85%;
            max-width: 900px;
            margin: 0 auto;
            padding-top: 10px;
            padding-bottom: 20px;
        }

        #giftScene {
            flex: 1;
            height: 55vh;
            background: transparent;
            border-radius: 25px;
            position: relative;
            box-shadow: none;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }

        #customPanel {
            width: 320px;
            height: 65vh;
            background: var(--panel-bg);
            border-radius: 25px;
            padding: 15px;
            overflow-y: auto;
            transition: background 0.5s ease, box-shadow 0.5s ease;
            scrollbar-width: thin;
            scrollbar-color: var(--glow-soft) rgba(0, 0, 0, 0.05);
        }

        #customPanel::-webkit-scrollbar {
            width: 8px;
        }

        #customPanel::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 10px;
        }

        #customPanel::-webkit-scrollbar-thumb {
            background: var(--glow-soft);
            border-radius: 10px;
        }

        #customPanel::-webkit-scrollbar-thumb:hover,
        #assetPanel::-webkit-scrollbar-thumb:hover {
            background: var(--heading-color);
        }

        #customPanel h2 {
            color: var(--heading-color);
            margin: 10px 0;
        }

        #customPanel img {
            width: 100px;
            display: block;
            margin: 10px auto;
            cursor: pointer;
            transition: .25s;
        }

        #customPanel img:hover,
        #assetPanel img:hover {
            transform: scale(1.05);
        }

        .draggable {
            position: absolute;
            cursor: move;
        }

        .note {
            width: 260px;
        }

        .note img {
            width: 100%;
        }

        .noteText {
            position: absolute;
            top: 12%;
            left: 10%;
            width: 75%;
            height: 70%;
            overflow: hidden;
            text-align: center;
            word-wrap: break-word;
            font-size: 18px;
        }

        /* --- GIFT CONTROLS --- */
        .giftControls {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--glow-soft);
        }

        .giftControls h2 {
            color: var(--heading-color);
            margin-bottom: 10px;
        }

        .giftControlBtn {

            margin: 6px 0;

            border-radius: 50px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-family: var(--font-ui);
            font-size: 15px;
            cursor: pointer;
            transition: transform 0.15s, background 0.3s;

        .giftControlBtn:hover {

        .gifSelected {

        /* --- Gift text element --- */
        .giftText {

        /* --- PEARL STARDUST BUTTON DESIGN --- */
        :root {
            --bg-pink: #fac5cf;
            --hover-glow: rgba(250, 197, 207, 0.6);
            --hover-glow-soft: rgba(183, 26, 61, 0.8);
            --btn-text-color: #5a0035;
        }



        .shiny-cta {
            outline: none;
            cursor: pointer;
            border: 0;
            position: relative;
            border-radius: 100px;
            background-color: var(--bg-pink);
            transition: all 0.2s ease;
            box-shadow:
                inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.4),
                inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
                inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.3),
                0 10px 15px -3px rgba(255, 105, 180, 0.3),
                0 4px 6px -2px rgba(255, 105, 180, 0.05);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 10px 24px;
        }

        .shiny-cta::before {
            content: "";
            position: absolute;
            left: -15%;
            right: -15%;
            bottom: 25%;
            top: -100%;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.25);
            transition: all 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .shiny-cta::after {
            content: "";
            position: absolute;
            left: 6%;
            right: 6%;
            top: 12%;
            bottom: 40%;
            border-radius: 22px 22px 0 0;
            box-shadow: inset 0 10px 8px -10px rgba(255, 255, 255, 0.6);
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.3) 0%,
                    rgba(255, 255, 255, 0) 50%,
                    rgba(255, 255, 255, 0) 100%);
            transition: all 0.3s ease;
            z-index: 1;
            pointer-events: none;
        }

        .shiny-cta span {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            color: var(--btn-text-color);
            transition: all 0.2s ease;
            transform: translateY(2%);
        }

        .shiny-cta>span::before {
            content: "✧";
            transition: all 0.2s ease;
        }

        .shiny-cta:hover>span::before {
            content: "✦";
        }

        .shiny-cta:hover {
            box-shadow:
                inset 0 0.3rem 0.5rem var(--hover-glow),
                inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
                0 12px 20px rgba(255, 105, 180, 0.4),
                0 4px 8px rgba(255, 105, 180, 0.1);
        }

        .shiny-cta:hover::before {
            transform: translateY(-5%);
        }

        .shiny-cta:hover::after {
            opacity: 0.4;
            transform: translateY(5%);
        }

        .shiny-cta:hover span {
            transform: translateY(-4%);
        }

        .shiny-cta:active {
            transform: translateY(2px);
            box-shadow:
                inset 0 0.3rem 0.5rem var(--hover-glow),
                inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.5),
                0 6px 10px rgba(183, 26, 61, 0.2);
        }





        @keyframes gradient-angle {

        }

        @keyframes shimmer {

        @keyframes breathe {

            from,

        .carousel-slide {

    <script defer>
        const giftScene = document.getElementById("giftScene");
        const bowBoundary = document.getElementById("bowBoundary");

        // Position the bowBoundary to match the inner area between the four bows.
        // Desktop giftbg: bows at ~20%/79% x, ~19%/70% y of VIEWPORT (background-attachment: fixed)
        // Mobile mobilegiftbg: bows at ~13%/82% x, ~27%/84% y of VIEWPORT
        function updateBowBoundary() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const sceneRect = giftScene.getBoundingClientRect();

            // Image properties for assets/giftbg.webp
            const imgW = 1672;
            const imgH = 941;
            const imgRatio = imgW / imgH;
            const winRatio = vw / vh;

            let scaledH, offsetY;
            if (winRatio > imgRatio) {
                // Window is wider, image width matches viewport, height is scaled up
                scaledH = vw / imgRatio;
                offsetY = (vh - scaledH) / 2;
            } else {
                // Window is narrower, image height matches viewport
                scaledH = vh;
                offsetY = 0;
            }

            // Exact bow centers in the original image 
            // (found via python image analysis: top=242px, bottom=729px)
            const bowTopRatio = 242 / imgH;
            const bowBottomRatio = 729 / imgH;

            const absTop = offsetY + (scaledH * bowTopRatio);
            const absBottom = offsetY + (scaledH * bowBottomRatio);

            const relLeft = 0;
            const relRight = sceneRect.width; // scene-relative right edge, symmetric to relLeft = 0
            const relTop = absTop - sceneRect.top;
            const relBottom = absBottom - sceneRect.top;

            // Do not clamp horizontally or vertically to the scene bounds
            // This allows dragging items anywhere across the full viewport exactly between the physical bow lines
            const sl = relLeft;
            const st = relTop;
            const sr = relRight;
            const sb = relBottom;

            bowBoundary.style.left = sl + "px";
            bowBoundary.style.top = st + "px";
            bowBoundary.style.width = (sr - sl) + "px";
            bowBoundary.style.height = (sb - st) + "px";
        }

        window.addEventListener('load', updateBowBoundary);
        window.addEventListener('resize', updateBowBoundary);
        setTimeout(updateBowBoundary, 200); // fallback after layout

        function getBowConstraints() {
            const br = bowBoundary.getBoundingClientRect();
            const sr = giftScene.getBoundingClientRect();
            return {
                left: br.left - sr.left,
                top: br.top - sr.top,
                right: br.right - sr.left,
                bottom: br.bottom - sr.top
            };
        }


        function resolveAccessorySrc(src) {
            if (!src) return "";
            let path = src.replace(/\\/g, "/");
            const assetsIndex = path.toLowerCase().indexOf("assets/");
            if (assetsIndex !== -1) {
                return path.substring(assetsIndex);
            }
            const filename = path.split("/").pop();
            if (filename.includes("custom")) {
                return "assets/plushies/" + filename;
            } else if (filename.includes("flower") || filename.includes("bow") || filename.includes("holder")) {
                return "assets/flowers/" + filename;
            }
        }

        /* Read from "giftItems" - the key set by checkout.js */
        const giftItems =
            JSON.parse(
                sessionStorage.getItem(
                    "giftItems"
                )
            ) || [];

        let selected = null;
        let currentNote = null;
        let highestZ = 1;

        /* Drag offset so item doesn't jump to cursor centre */
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        /* -------------------- */
        /* HELPER: make element */
        /* selectable & draggable */
        /* -------------------- */

        function updateSelectionUI() {
            const deleteBtn = document.getElementById('itemDeleteBtn');
            const rotateBtn = document.getElementById('itemRotateBtn');
            const resizeBtn = document.getElementById('itemResizeBtn');

            if (!selected) {
                if (deleteBtn) deleteBtn.style.display = 'none';
                if (rotateBtn) rotateBtn.style.display = 'none';
                if (resizeBtn) resizeBtn.style.display = 'none';
                return;
            }

            const l = parseFloat(selected.style.left) || 0;
            const t = parseFloat(selected.style.top) || 0;
            const w = selected.offsetWidth;
            const h = selected.offsetHeight;

            const cx = l + w / 2;
            const cy = t + h / 2;

            const angle = parseFloat(selected.dataset.rotation) || 0;
            const rad = angle * Math.PI / 180;
            const flip = parseInt(selected.dataset.flip) || 1;

            function getRotatedPoint(dx, dy) {
                let rx = dx * Math.cos(rad) - dy * Math.sin(rad);
                let ry = dx * Math.sin(rad) + dy * Math.cos(rad);
                rx *= flip;
                return {
                    x: cx + rx,
                    y: cy + ry
                };
            }

            // Top Right (Delete)
            const tr = getRotatedPoint(w / 2, -h / 2);
            // Bottom Left (Rotate)
            const bl = getRotatedPoint(-w / 2, h / 2);
            // Bottom Right (Resize)
            const br = getRotatedPoint(w / 2, h / 2);

            if (deleteBtn) {
                deleteBtn.style.left = (tr.x - 12) + 'px';
                deleteBtn.style.top = (tr.y - 12) + 'px';
                deleteBtn.style.display = 'flex';
            }

            if (rotateBtn) {
                rotateBtn.style.left = (bl.x - 12) + 'px';
                rotateBtn.style.top = (bl.y - 12) + 'px';
                rotateBtn.style.display = 'flex';
            }

            if (resizeBtn) {
                resizeBtn.style.left = (br.x - 12) + 'px';
                resizeBtn.style.top = (br.y - 12) + 'px';
                resizeBtn.style.display = 'flex';
            }
        }

        function selectElement(el) {
            selected = el;
            document.querySelectorAll(".gifSelected").forEach(item => {
                item.classList.remove("gifSelected");
                item.style.outline = "none";
                item.style.borderRadius = "";
            });

            if (el) {
                el.classList.add("gifSelected");
                el.style.outline = "3px solid #B71A3D";
                el.style.borderRadius = "24px";
                updateSelectionUI();
            } else {
                updateSelectionUI();
                giftScene.style.cursor = '';
            }
        }

        let isResizing = false;
        let isRotating = false;
        let isDragging = false;
        let resizeStartX = 0, resizeStartY = 0;
        let resizeStartW = 0, resizeStartH = 0;
        let resizeStartLeft = 0, resizeStartTop = 0;
        let rotateStartAngle = 0;
        let rotateInitialElementAngle = 0;

        function makeDraggable(el) {
            // Mouse events
            el.addEventListener("mousedown", (e) => {
                if (e.target.closest('#itemDeleteBtn') || e.target.closest('#itemRotateBtn') || e.target.closest('#itemResizeBtn')) return;
                e.stopPropagation();
                if (selected !== el) selectElement(el);
                isDragging = true;
                el.style.zIndex = highestZ++;
                const rect = el.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                e.preventDefault();
                giftScene.style.cursor = 'grabbing';
            });

            // Touch events for mobile
            el.addEventListener("touchstart", (e) => {
                if (e.target.closest('#itemDeleteBtn') || e.target.closest('#itemRotateBtn') || e.target.closest('#itemResizeBtn')) return;
                e.stopPropagation();
                if (selected !== el) selectElement(el);
                isDragging = true;
                el.style.zIndex = highestZ++;
                const touch = e.touches[0];
                const rect = el.getBoundingClientRect();
                dragOffsetX = touch.clientX - rect.left;
                dragOffsetY = touch.clientY - rect.top;
                e.preventDefault();
            }, { passive: false });
        }

        function getPointerEvent(e) {
            return e.touches ? e.touches[0] : e;
        }

        function handlePointerDownButtons(e) {
            if (e.target.closest('#itemDeleteBtn')) {
                if (selected) {
                    selected.remove();
                    selectElement(null);
                }
                return;
            }

            if (e.target.closest('#itemResizeBtn') && selected) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
                isResizing = true;
                const pt = getPointerEvent(e);
                resizeStartX = pt.clientX;
                resizeStartY = pt.clientY;
                resizeStartW = selected.offsetWidth;
                resizeStartH = selected.offsetHeight;
                resizeStartLeft = parseFloat(selected.style.left) || 0;
                resizeStartTop = parseFloat(selected.style.top) || 0;
                return;
            }

            if (e.target.closest('#itemRotateBtn') && selected) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
                isRotating = true;
                const pt = getPointerEvent(e);

                const rect = selected.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                rotateStartAngle = Math.atan2(pt.clientY - cy, pt.clientX - cx) * 180 / Math.PI;
                rotateInitialElementAngle = parseFloat(selected.dataset.rotation) || 0;
                return;
            }
        }

        document.addEventListener("mousedown", handlePointerDownButtons);
        document.addEventListener("touchstart", handlePointerDownButtons, { passive: false });

        /* -------------------- */
        /* LOAD GIFT ITEMS      */
        /* -------------------- */


        giftItems.forEach((item, itemIndex) => {
            const qty = item.quantity || 1;
            for (let q = 0; q < qty; q++) {

                if (item.type === 'text') {
                    const textEl = document.createElement("div");
                    textEl.className = "draggable giftEl giftText";
                    textEl.dataset.itemIndex = itemIndex;
                    textEl.style.position = "absolute";
                    textEl.style.left = (150 + q * 20) + "px";
                    textEl.style.top = (200 + q * 20) + "px";
                    textEl.style.zIndex = highestZ++;
                    textEl.style.fontFamily = item.fontFamily || "Pacifico, cursive";
                    textEl.style.fontSize = "22px";
                    textEl.style.color = item.color || "#B71A3D";
                    textEl.style.cursor = "move";
                    textEl.style.userSelect = "none";
                    textEl.innerText = item.text || "Custom Text";

                    makeDraggable(textEl);
                    giftScene.appendChild(textEl);
                    continue;
                }

                if (item.type === 'note') {
                    const wrapper = document.createElement("div");
                    wrapper.className = "note draggable giftEl";
                    wrapper.dataset.itemIndex = itemIndex;
                    wrapper.style.position = "absolute";
                    wrapper.style.left = (200 + q * 20) + "px";
                    wrapper.style.top = (150 + q * 20) + "px";
                    const scaleMultiplier = item.scale || 1;
                    wrapper.style.width = (220 * scaleMultiplier) + "px";
                    wrapper.style.zIndex = highestZ++;

                    const angleRad = item.angle || 0;
                    const angleDeg = angleRad * (180 / Math.PI);
                    wrapper.dataset.rotation = angleDeg;
                    wrapper.style.transform = `rotate(${angleDeg}deg)`;

                    const paper = document.createElement("img");
                    paper.src = item.src;
                    paper.style.width = "100%";
                    paper.style.display = "block";
                    paper.draggable = false;
                    wrapper.className = "note giftEl";

                    wrapper.style.containerType = "inline-size";
                    wrapper.style.aspectRatio = "1 / 1";
                    wrapper.style.height = wrapper.style.width;

                    wrapper.appendChild(paper);

                    if (item.noteTextDetails) {
                        const textDiv = document.createElement("div");
                        textDiv.className = "noteText";
                        textDiv.innerText = item.noteTextDetails.text;
                        textDiv.style.fontFamily = item.noteTextDetails.fontFamily;
                        textDiv.style.color = item.noteTextDetails.color;

                        if (item.noteTextDetails.left !== undefined) {
                            textDiv.style.position = "absolute";
                            textDiv.style.left = item.noteTextDetails.left + "%";
                            textDiv.style.top = item.noteTextDetails.top + "%";
                            textDiv.style.width = item.noteTextDetails.width ? (item.noteTextDetails.width + "%") : "60%";

                            let flipStr = item.noteTextDetails.flip == "-1" ? "scaleX(-1) " : "";
                            textDiv.style.transform = `translate(-50%, -50%) ${flipStr}rotate(${item.noteTextDetails.angle || 0}rad) scale(${item.noteTextDetails.scale || 1})`;

                            const savedHeight = item.noteTextDetails.height ? (item.noteTextDetails.height + "%") : "60%";
                            textDiv.style.height = savedHeight;
                            textDiv.style.maxHeight = savedHeight;
                            textDiv.style.overflow = "hidden";
                            textDiv.style.whiteSpace = "pre-wrap";
                            textDiv.style.wordBreak = "break-word";
                            textDiv.style.textAlign = "center";
                            textDiv.style.lineHeight = "1.2";
                            // Use saved fontSize (% of note paper width) so it scales correctly with the wrapper.
                            // Fall back to 3.8cqw only if no fontSize was saved.
                            if (item.noteTextDetails.fontSize) {
                                textDiv.style.fontSize = item.noteTextDetails.fontSize + "cqw";
                            } else {
                                textDiv.style.fontSize = "3.8cqw";
                            }
                        }

                        wrapper.appendChild(textDiv);
                    }

                    if (item.stickers) {
                        item.stickers.forEach(st => {
                            const stickerImg = document.createElement("img");
                            stickerImg.src = st.src;
                            stickerImg.style.position = "absolute";
                            stickerImg.style.left = st.left + "%";
                            stickerImg.style.top = st.top + "%";
                            stickerImg.style.width = st.width + "%";
                            let stFlip = st.flip == "-1" ? "scaleX(-1) " : "";
                            stickerImg.style.transform = `translate(-50%, -50%) ${stFlip}rotate(${st.angle || 0}rad) scale(${st.scale || 1})`;
                            stickerImg.style.pointerEvents = "none";
                            wrapper.appendChild(stickerImg);
                        });
                    }

                    makeDraggable(wrapper);
                    giftScene.appendChild(wrapper);
                    continue;
                }

                if (item.type === 'sticker') {
                    const img = document.createElement("img");
                    img.src = item.src;
                    img.className = "draggable giftEl";
                    img.dataset.itemIndex = itemIndex;
                    img.style.position = "absolute";
                    img.style.width = "100px";
                    img.style.left = (250 + q * 20) + "px";
                    img.style.top = (250 + q * 20) + "px";
                    img.style.zIndex = highestZ++;
                    img.draggable = false;

                    makeDraggable(img);
                    giftScene.appendChild(img);
                    continue;
                }

                // Standard plushie/flower/treat
                const wrapper = document.createElement("div");
                wrapper.className = "draggable giftEl";
                wrapper.dataset.itemIndex = itemIndex;

                const isBouquet = (item.customId && item.customId.startsWith("bouquet_")) || (item.name && item.name.toLowerCase().includes("bouquet"));
                if (isBouquet) wrapper.dataset.isBouquet = "true";

                wrapper.style.position = "absolute";
                wrapper.style.left = (80 + q * 30) + "px";
                wrapper.style.top = (80 + q * 30) + "px";
                wrapper.style.width = "180px";

                let canvasW = isBouquet ? 600 : 280;
                let canvasH = canvasW;
                let canvasL = isBouquet ? 50 : 210;
                let canvasT = isBouquet ? 50 : 210;

                if (item.canvasW !== undefined) {
                    canvasW = item.canvasW;
                    canvasH = item.canvasH;
                    canvasL = item.canvasL;
                    canvasT = item.canvasT;
                }

                if (isBouquet || item.canvasW !== undefined) {
                    wrapper.style.height = (180 * (canvasH / canvasW)) + "px";
                } else {
                    wrapper.style.height = "auto";
                }

                wrapper.style.zIndex = highestZ++;

                const baseImg = document.createElement("img");
                baseImg.src = item.image || item.src; // fallback for src

                if (isBouquet || item.canvasW !== undefined) {
                    baseImg.style.position = "absolute";
                    baseImg.style.width = "100%";
                    baseImg.style.height = "100%";
                    baseImg.style.objectFit = "contain";
                } else {
                    baseImg.style.width = "100%";
                    baseImg.style.height = "auto";
                    baseImg.style.objectFit = "contain";
                }

                baseImg.style.left = "0";
                baseImg.style.top = "0";
                baseImg.style.transform = "none";
                baseImg.style.display = "block";
                baseImg.draggable = false;

                wrapper.appendChild(baseImg);

                if (item.accessories && item.accessories.length > 0) {
                    item.accessories.forEach((acc, index) => {
                        const accessory = document.createElement("img");
                        let src = acc.image;
                        if (src) src = resolveAccessorySrc(src);
                        accessory.src = src;
                        accessory.style.position = "absolute";
                        accessory.style.pointerEvents = "none";
                        const rawLeft = parseFloat(acc.left);
                        const rawTop = parseFloat(acc.top);
                        const rawWidth = parseFloat(acc.width);

                        // Backwards compatibility for old saved bouquets (using virtual offset +350 -300)
                        let adjustedLeft = rawLeft;
                        let adjustedTop = rawTop;
                        if (item.canvasW === undefined && isBouquet) {
                            adjustedLeft = rawLeft - 50;
                            adjustedTop = rawTop - 50;
                        } else if (item.canvasW === undefined && !isBouquet) {
                            adjustedLeft = rawLeft - 210;
                            adjustedTop = rawTop - 210;
                        } else {
                            adjustedLeft = rawLeft - canvasL;
                            adjustedTop = rawTop - canvasT;
                        }

                        accessory.style.left = ((adjustedLeft / canvasW) * 100) + "%";
                        accessory.style.top = ((adjustedTop / canvasH) * 100) + "%";
                        accessory.style.width = ((rawWidth / canvasW) * 100) + "%";

                        if (index === 0 && !isBouquet && item.canvasW !== undefined) {
                            accessory.style.height = "auto";
                            accessory.style.display = "block";
                        } else {
                            if (acc.height) {
                                const rawHeight = parseFloat(acc.height);
                                accessory.style.height = ((rawHeight / canvasH) * 100) + "%";
                                accessory.style.objectFit = "contain";
                            }
                        }

                        let accFlip = acc.flip == "-1" ? "scaleX(-1) " : "";
                        accessory.style.transform = `${accFlip}rotate(${acc.rotation || 0}deg)`;
                        wrapper.appendChild(accessory);
                    });
                }


                makeDraggable(wrapper);
                giftScene.appendChild(wrapper);
            }
        });

        /* -------------------- */
        /* GLOBAL DRAG MOVE     */
        /* -------------------- */

        function handlePointerMove(e) {
            const pt = getPointerEvent(e);
            const sceneW = giftScene.clientWidth;
            const sceneH = giftScene.clientHeight;

            if (isResizing && selected) {
                const dx = pt.clientX - resizeStartX;
                const isText = selected.classList.contains("giftText");

                if (isText) {
                    let currentFS = parseFloat(window.getComputedStyle(selected).fontSize) || 16;
                    const dy = pt.clientY - resizeStartY;
                    selected.style.fontSize = Math.max(10, currentFS + dy / 10) + "px";
                    resizeStartY = pt.clientY;
                } else {
                    const b = getBowConstraints();
                    let maxWByWidth = b.right - resizeStartLeft;
                    let maxWByHeight = (b.bottom - resizeStartTop) * (resizeStartW / resizeStartH);
                    let maxW = Math.min(maxWByWidth, maxWByHeight);
                    let newW = resizeStartW + dx;
                    newW = Math.max(30, Math.min(newW, maxW));

                    selected.style.width = newW + "px";
                    selected.style.height = (newW * (resizeStartH / resizeStartW)) + "px";
                }
                updateSelectionUI();
                if (e.cancelable) e.preventDefault();
                return;
            }

            if (isRotating && selected) {
                const rect = selected.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const currentAngle = Math.atan2(pt.clientY - cy, pt.clientX - cx) * 180 / Math.PI;

                let angleDiff = currentAngle - rotateStartAngle;
                let newAngle = rotateInitialElementAngle + angleDiff;

                selected.dataset.rotation = newAngle;
                let flipStr = selected.dataset.flip === "-1" ? "scaleX(-1) " : "";
                selected.style.transform = flipStr + "rotate(" + newAngle + "deg)";
                updateSelectionUI();
                if (e.cancelable) e.preventDefault();
                return;
            }

            if (!selected || isResizing || isRotating || !isDragging) return;

            const sceneRect = giftScene.getBoundingClientRect();
            let newLeft = pt.clientX - sceneRect.left - dragOffsetX;
            let newTop = pt.clientY - sceneRect.top - dragOffsetY;

            // Constrain within the four-bow area
            const b = getBowConstraints();
            newLeft = Math.max(b.left, Math.min(newLeft, b.right - selected.offsetWidth));
            newTop = Math.max(b.top, Math.min(newTop, b.bottom - selected.offsetHeight));

            selected.style.left = newLeft + "px";
            selected.style.top = newTop + "px";
            updateSelectionUI();
            if (e.cancelable) e.preventDefault();
        }

        function handlePointerUp() {
            isResizing = false;
            isRotating = false;
            isDragging = false;
            if (selected) {
                giftScene.style.cursor = 'grab';
            } else {
                giftScene.style.cursor = '';
            }
        }

        document.addEventListener("mousemove", handlePointerMove);
        document.addEventListener("touchmove", handlePointerMove, { passive: false });
        document.addEventListener("mouseup", handlePointerUp);
        document.addEventListener("touchend", handlePointerUp);

        /* Click on scene background to deselect */
        giftScene.addEventListener("mousedown", (e) => {
            if (e.target === giftScene || e.target.closest('.canvas-placeholder')) {
                selectElement(null);
            }
        });

        /* -------------------- */
        /* SERIALIZE & SAVE     */
        /* -------------------- */

        const saveGiftBtn = document.getElementById("saveGiftLayoutBtn");
        if (saveGiftBtn) {
            saveGiftBtn.addEventListener("click", () => {
                const savedLayout = [];
                const sceneW = giftScene.offsetWidth;
                const sceneH = giftScene.offsetHeight;
                document.querySelectorAll("#giftScene .giftEl").forEach(el => {
                    const isPlushie = el.classList.contains("draggable") && !el.classList.contains("note") && !el.classList.contains("giftText") && el.querySelector("img") && !el.querySelector("img").src.includes("sticker");
                    const isNote = el.classList.contains("note");
                    const isText = el.classList.contains("giftText");
                    const isSticker = el.querySelector("img") && el.querySelector("img").src.includes("sticker") || el.tagName === "IMG";

                    let type = "sticker";
                    if (isPlushie) type = "plushie";
                    else if (isNote) type = "note";
                    else if (isText) type = "text";

                    let src = "";
                    let text = "";
                    let noteTextDetails = null;
                    let noteStickers = [];

                    if (type === "plushie") {
                        src = el.querySelector("img").src;
                    } else if (type === "note") {
                        src = el.querySelector("img").src;
                        const textDiv = el.querySelector(".noteText");
                        if (textDiv) {
                            noteTextDetails = {
                                text: textDiv.innerText,
                                fontFamily: textDiv.style.fontFamily,
                                color: textDiv.style.color,
                                left: parseFloat(textDiv.style.left) || undefined,
                                top: parseFloat(textDiv.style.top) || undefined,
                                width: parseFloat(textDiv.style.width) || undefined,
                                height: parseFloat(textDiv.style.height) || undefined,
                                fontSize: parseFloat(textDiv.style.fontSize) || undefined,
                                angle: textDiv.style.transform.includes('rotate') ? parseFloat(textDiv.style.transform.split('rotate(')[1]) : 0,
                                scale: textDiv.style.transform.includes('scale(') ? parseFloat(textDiv.style.transform.split('scale(')[1]) : 1
                            };
                        }
                    } else if (type === "sticker") {
                        src = el.tagName === "IMG" ? el.src : el.querySelector("img").src;
                    } else if (type === "text") {
                        text = el.innerText;
                    }

                    const rawLeft = parseFloat(el.style.left) || 0;
                    const rawTop = parseFloat(el.style.top) || 0;
                    const rawWidth = parseFloat(el.style.width) || 0;
                    const rawHeight = parseFloat(el.style.height);
                    const leftPct = rawLeft / sceneW * 100;
                    const topPct = rawTop / sceneH * 100;
                    const widthPct = rawWidth / sceneW * 100;
                    const heightPct = (el.style.height && el.style.height !== "auto") ? (rawHeight / sceneH * 100) : null;

                    let accessories = [];
                    const itemIndex = el.dataset.itemIndex;
                    if (itemIndex !== undefined && giftItems[itemIndex]) {
                        accessories = giftItems[itemIndex].accessories || [];
                    }

                    let stickers = [];
                    let canvasW, canvasH, canvasL, canvasT;
                    if (itemIndex !== undefined && giftItems[itemIndex]) {
                        const itemData = giftItems[itemIndex];
                        accessories = itemData.accessories || [];
                        stickers = itemData.stickers || [];
                        canvasW = itemData.canvasW;
                        canvasH = itemData.canvasH;
                        canvasL = itemData.canvasL;
                        canvasT = itemData.canvasT;
                    }

                    const isBouquetItem = el.dataset.isBouquet === "true";

                    savedLayout.push({
                        type: type,
                        isBouquet: isBouquetItem,
                        // Percentage-based positions — device-independent
                        leftPct: leftPct,
                        topPct: topPct,
                        widthPct: widthPct,
                        heightPct: heightPct,
                        // Legacy pixel fields kept for shared-link backwards compat
                        left: el.style.left,
                        top: el.style.top,
                        width: el.style.width,
                        height: el.style.height,
                        sceneW: sceneW,
                        sceneH: sceneH,
                        zIndex: el.style.zIndex,
                        rotation: el.dataset.rotation || "0",
                        flip: el.dataset.flip || "1",
                        src: src,
                        text: text,
                        noteTextDetails: noteTextDetails,
                        stickers: stickers,
                        fontFamily: el.style.fontFamily || "",
                        fontSize: el.style.fontSize || "",
                        color: el.style.color || "",
                        accessories: accessories,
                        canvasW: canvasW,
                        canvasH: canvasH,
                        canvasL: canvasL,
                        canvasT: canvasT,
                    });
                });

                sessionStorage.setItem("savedGiftLayout", JSON.stringify(savedLayout));
                window.location = "final.html";
            });
        }

    </script>


    <style>
        /* Glass canvas removed as requested */
        #saveGiftLayoutBtn {
            background-color: #ffffff !important;
        }

        #saveGiftLayoutBtn>span {
            color: #ff6b81 !important;
        }

        #saveGiftLayoutBtn>span::before {
            content: none !important;
            display: none !important;
        }
    </style>

</body>
