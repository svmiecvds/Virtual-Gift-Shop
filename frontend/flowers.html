/* --- THEME VARIABLES --- */
:root {
    --bg-gradient: linear-gradient(135deg, #fce0e5 0%, #fac5cf 40%, #fac5cf 100%);
    --body-bg: #fef2f4;
    --panel-bg: #fce0e5;
    --popup-bg: #fce0e5;
    --receipt-bg: #fef2f4;
    --card-bg: #ffffff;
    --text-color: #B71A3D;
    --heading-color: #B71A3D;
    --btn-bg: #ffffff;
    --btn-text: #B71A3D;
    --cart-btn-bg: #B71A3D;
    --cart-btn-shadow: #B71A3D;
    --glow-color: #B71A3D;
    --glow-soft: #fac5cf;
    --toast-bg: #B71A3D;
    --receipt-shadow: #fac5cf;
    --shelf-overlay: rgba(255,255,255,0.0);
    --font-body: 'Quicksand', sans-serif;
    --font-heading: 'Pinyon Script', cursive;
    --font-ui: 'Fredoka', sans-serif;
    --font-nav: 'Inter', sans-serif;
}



/* --- BASE --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { scrollbar-width: none; background-color: #fef2f4; /* prevent white overscroll on iOS */ }
html::-webkit-scrollbar { display: none; }
html_REMOVED {
    transition: background-color 0.5s ease, color 0.5s ease;
}

html::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -999;
    background-image: url('assets/flowersbg.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    pointer-events: none;
    transform: translateZ(0);
    will-change: transform;
}

body,
body.receiptPage,
body.giftPage {
    color: var(--text-color);
    background: transparent !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.5s ease, color 0.5s ease;
    font-family: var(--font-body);
    font-weight: 500;
}

.sidebar-panel {
    display: none;
    /* --- controlled by JS --- */
    background: var(--popup-bg);
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    transition: background 0.5s ease, box-shadow 0.5s ease;
}

#shelf {
    width: 1000px;
    height: 800px;
    background: url("shelf.webp");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    position: relative;
    margin: auto;

/* --- Shelf stays strictly center aligned --- */
}

.character {
    position: absolute;
    width: 170px;
    cursor: pointer;
    transition: .25s;
}

.character:hover {
    transform: scale(1.05);
}

/* --- CHECKOUT BUTTON --- */


/* --- QUANTITY POPUP --- */
#quantityPopup h2 {
    color: var(--heading-color);
    margin-bottom: 15px;
    font-size: 20px;
}

.quantitySelector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 15px;
}

.quantitySelector button {
    width: 45px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    font-size: 22px;
    font-family: var(--font-ui);
    transition: background 0.5s ease, color 0.5s ease;
}

#quantityValue {
    font-size: 26px;
    color: var(--heading-color);
    font-weight: bold;
}

#addToCartBtn {
    border: none;
    border-radius: 50px;
    padding: 12px 24px;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--btn-text);
    font-size: 15px;
    width: 100%;
    font-family: var(--font-ui);
    transition: transform .25s, background 0.5s ease, color 0.5s ease;
}

#addToCartBtn:hover {
    transform: scale(1.03);
}

/* --- TOAST --- */
#toast {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toast-bg);
    color: white;
    padding: 15px 25px;
    border-radius: 50px;
    box-shadow: none;
    z-index: 9999;
    transition: background 0.5s ease;
}

/* --- Highlight selected gift element --- */
.gifSelected {
    outline: 3px solid #B71A3D !important;
    outline-offset: 3px;
}

/* --- Gift text element --- */
.giftText {
    min-width: 80px;
    font-size: 22px;
    color: var(--heading-color);
    user-select: none;
    cursor: move;
    white-space: pre-wrap;
    word-break: break-word;
}

/* --- CUSTOM ALIGNMENTS --- */
.checkoutTitle, .customizeTitle {
    text-align: center !important;
    font-family: var(--font-heading);
    color: var(--heading-color);
    margin-top: 100px;
    margin-bottom: 25px;
    font-size: 50px;
    text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4);
    font-weight: bold;
}



/* --- NAVBAR --- */
#storeNavbar {
    background: url('assets/kisses-bg.webp') center/cover no-repeat !important;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(255, 228, 241, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 30px;
    z-index: 999;
    border-bottom: 3px solid #fac5cf;
    box-shadow: 0 4px 15px rgba(255, 105, 180, 0.1);
    padding: 10px 30px;
    box-sizing: border-box;
}



.navLink {
    font-size: 16px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
}

.navLink:hover {
    color: white;
    transform: translateY(-2px);
    opacity: 0.9;
}

.navLink.active {
    color: white;
    font-weight: 800;
    border-bottom: 3px solid var(--heading-color);
    padding-bottom: 2px;
}



/* --- Header Text styling --- */
.storeHeader {
    text-align: center;
    margin-top: 100px;
    margin-bottom: 20px;
    color: var(--heading-color);
    font-family: var(--font-heading);
    font-size: 56px;
    text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4);
    font-weight: bold;
}



/* --- CARD LAYOUT SYSTEM --- */
#flowersMainContainer, #bouquetMainContainer {
    flex: 1;
    display: flex;
    flex-direction: column;
    width: 100%;
}

.flowers-layout, .plushies-layout {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 40px;
    width: 100%;
    max-width: 1200px;
    margin: auto;
    align-items: center;
}

.flowersRowTop, .flowersRowBottom {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 40px;
    width: 100%;
}

.flowerCard {
    background: var(--card-bg);
    border-radius: 30px;
    border: 2px solid rgba(255, 182, 217, 0.15);
    padding: 25px;
    width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease, border-color 0.3s ease;
    position: relative;
}

.flowerCard:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: rgba(255, 105, 180, 0.4);
    box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
}

.flowerImage {
    width: 180px;
    height: 180px;
    object-fit: contain;
    margin-bottom: 15px;
    transition: transform 0.5s ease;
}

.flowerCard:hover .flowerImage {
    transform: rotate(5deg) scale(1.05);
}

.flowerName {
    font-size: 24px;
    color: var(--heading-color);
    margin-bottom: 15px;
    font-family: 'Pinyon Script', cursive !important;
    text-align: center;
    text-shadow: 1px 1px 0px rgba(255,255,255,0.8);
}



.flowerSelector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 20px;
    background: rgba(255, 182, 193, 0.15);
    padding: 6px 16px;
    border-radius: 50px;
    border: 2px dashed #fac5cf;
}



.flowerSelector button {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--btn-text);
    cursor: pointer;
    font-size: 20px;
    font-family: var(--font-ui);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.3s;
}

.flowerSelector button:hover {
    transform: scale(1.15);
    background: var(--cart-btn-bg);
    color: white;
}

.flowerSelector button:active {
    transform: scale(0.95);
}

.flowerQuantity {
    font-size: 20px;
    color: var(--heading-color);
    font-weight: 600;
    font-family: var(--font-ui);
    min-width: 25px;
    text-align: center;
}

.flowerCard .addToCartBtn, .flowerCard .customizeBtn {
    border: none;
    border-radius: 50px;
    padding: 12px 24px;
    cursor: pointer;
    background: var(--btn-bg);
    color: var(--text-color);
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: bold;
    width: 100%;
    margin-bottom: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.flowerCard .customizeBtn {
    margin-top: auto;
    margin-bottom: 20px;
}

.flowerCard .addToCartBtn:hover, .flowerCard .customizeBtn:hover {
    transform: scale(1.05);
    background: #fce0e5;
}

.flowerCard .addToCartBtn:active, .flowerCard .customizeBtn:active {
    transform: scale(0.98);
}

/* --- BACK TO SHOP BTN --- */




/* --- Big chosen box canvas - a tad bit smaller (600x600px) --- */

/* --- Bubbly option elements inside selection panel --- */
.box-option {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px 20px;
    background: var(--btn-bg);
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    width: 100%;
}

.box-option:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: #B71A3D;
    box-shadow: 0 5px 12px rgba(183, 26, 61, 0.2);
}

.box-option.active {
    background: #fac5cf;
    border-color: #B71A3D;
    box-shadow: none;
}

.box-option img {
    width: 45px;
    height: 32px;
    object-fit: contain;
}

.box-option span {
    font-size: 16px;
    font-family: var(--font-ui);
    font-weight: 600;
    color: var(--text-color);
}

.box-option.active span {
    color: #5a0035;
}







/* --- Customization Buttons Placed Side-by-Side --- */
.buttons-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 10px;
}

.buttons-row button {
    flex: 1;
    margin: 0 !important;
    padding: 12px 6px !important;
    font-size: 14px !important;
    border-radius: 25px !important;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: #fce0e5;
    color: #5a0035;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
}

.buttons-row button:hover {
    transform: scale(1.05);
}

#saveCustomization {
    background: #fac5cf !important;
    color: #5a0035 !important;
    box-shadow: 0 0 10px pink !important;
}

#saveCustomization:hover {
    box-shadow: none !important;
}
.draggableTreat {
    position: absolute;
    width: 70px;
    height: 70px;
    object-fit: contain;
    cursor: inherit;
    z-index: 10;
    transition: transform 0.1s ease;
}

.draggableBouquetItem {
    cursor: inherit;
    transition: outline 0.1s ease;
}

/* --- PEARL STARDUST BUTTON DESIGN --- */
:root {
    --bg-pink: #fac5cf;
    --hover-glow: rgba(250, 197, 207, 0.6);
    --hover-glow-soft: rgba(183, 26, 61, 0.8);
    --btn-text-color: #5a0035;
}



.shiny-cta {
    outline: none;
    cursor: pointer;
    border: 0;
    position: relative;
    border-radius: 100px;
    background-color: var(--bg-pink);
    transition: all 0.2s ease;
    box-shadow: 
      inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.4),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
      inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.3),
      0 10px 15px -3px rgba(255, 105, 180, 0.3),
      0 4px 6px -2px rgba(255, 105, 180, 0.05);
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    padding: 10px 24px;
}

.shiny-cta::before {
    content: "";
    position: absolute;
    left: -15%;
    right: -15%;
    bottom: 25%;
    top: -100%;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.25);
    transition: all 0.3s ease;
    z-index: 1;
    pointer-events: none;
}

.shiny-cta::after {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    top: 12%;
    bottom: 40%;
    border-radius: 22px 22px 0 0;
    box-shadow: inset 0 10px 8px -10px rgba(255, 255, 255, 0.6);
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.3) 0%,
      rgba(255, 255, 255, 0) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transition: all 0.3s ease;
    z-index: 1;
    pointer-events: none;
}

.shiny-cta span {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: var(--btn-text-color);
    transition: all 0.2s ease;
    transform: translateY(2%);
}

.shiny-cta > span::before {
    content: "✧";
    transition: all 0.2s ease;
}

.shiny-cta:hover > span::before {
    content: "✦";
}

.shiny-cta:hover {
    box-shadow:
      inset 0 0.3rem 0.5rem var(--hover-glow),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
      0 12px 20px rgba(255, 105, 180, 0.4),
      0 4px 8px rgba(255, 105, 180, 0.1);
}

.shiny-cta:hover::before {
    transform: translateY(-5%);
}

.shiny-cta:hover::after {
    opacity: 0.4;
    transform: translateY(5%);
}

.shiny-cta:hover span {
    transform: translateY(-4%);
}

.shiny-cta:active {
    transform: translateY(2px);
    box-shadow:
      inset 0 0.3rem 0.5rem var(--hover-glow),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.5),
      0 6px 10px rgba(183, 26, 61, 0.2);
}

/* --- CAROUSEL STYLES (NO-SCROLL LAYOUT) --- */
body.no-scroll {
    overflow-x: hidden !important;
    overflow-y: auto !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

body.no-scroll #mainContainer {
    flex: 1;
    min-height: 650px;
    padding: 0;
    display: flex;
    justify-content: center;
}

body.no-scroll .storeHeader {
    margin-top: 80px;
    margin-bottom: 0px;
    flex-shrink: 0;
    font-weight: bold;
}

.plushies-layout, .flowers-layout {
    width: 100%;
}

.carousel-wrapper {
    position: relative;
    width: 90%;
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 60px;
    height: auto;
    overflow: hidden;
}

.carousel-track-container {
    overflow: visible;
    width: 100%;
    padding: 15px 0;

/* --- extra padding for box shadows --- */
}

.carousel-track {
    display: flex;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}

.carousel-slide {
    flex: 0 0 calc(100% / 3.3);

/* --- Show ~3 items with a peek of the next --- */
padding: 0 15px;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
}



.carousel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #fafafa;
    border: 1px solid #e4e4e7;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    color: #52525b;
    cursor: pointer;
    z-index: 10;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
}



.carousel-btn:hover:not(:disabled) {
    background: #f4f4f5;
    color: #18181b;
}



.carousel-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.carousel-prev {
    left: 0;
}

.carousel-next {
    right: 0;
}

.carousel-slide .flowerCard {
    width: 100%;

/* --- Take up the slide width --- */
max-width: 320px;

/* --- Don't get too crazy large --- */
margin: 0 auto;
}

/* --- NAV BRAND CENTERING --- */
.navBrand {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    margin: 0;
    font-family: var(--font-heading);
    font-size: 28px;
    color: white !important;
    text-decoration: none;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), text-shadow 0.3s ease;
}

.navBrand:hover {
    transform: translateX(-50%) scale(1.08);
    text-shadow: none;
}
/* --- BOUQUET STYLES --- */
#mainContainer {
        flex: 1;
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .bouquet-layout {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 24px;
        padding: 10px 20px;
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
    }

    /* --- SIDE PANELS --- */
    .side-panel {
    width: 280px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background: rgba(144, 12, 63, 0.15) !important;
    padding: 24px;
    border-radius: 24px;
    transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}

    

    .side-panel h2 {
        text-align: center;
        margin-bottom: 15px;
        font-family: 'Pinyon Script', cursive !important;
        font-weight: normal !important;
        font-size: 36px !important;
        color: var(--heading-color);
        letter-spacing: 1px;
        border-bottom: 2px dashed rgba(144, 12, 63, 0.4);
        padding-bottom: 8px;
    }

    .side-panel::-webkit-scrollbar {
        width: 6px;
    }

    .side-panel::-webkit-scrollbar-track {
        background: transparent;
    }

    .side-panel::-webkit-scrollbar-thumb {
        background: #900C3F;
        border-radius: 10px;
    }

    

    /* --- SPAWNER GRID --- */
    .spawner-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-bottom: 20px;
    }

    .spawner-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--card-bg);
        border-radius: 16px;
        padding: 10px;
        border: 2px solid rgba(255, 182, 217, 0.15);
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s, box-shadow 0.25s;
        text-align: center;
    }

    

    .spawner-item:hover {
        transform: scale(1.05) translateY(-2px);
        border-color: rgba(255, 105, 180, 0.4);
        box-shadow: 0 4px 12px rgba(255, 105, 180, 0.15);
    }

    .spawner-item img {
        width: 65px;
        height: 65px;
        object-fit: contain;
        margin-bottom: 6px;
    }

    .spawner-item span {
        font-size: 11px;
        font-family: var(--font-ui);
        font-weight: 600;
        color: var(--text-color);
        line-height: 1.2;
    }

    /* --- CANVAS AREA --- */
    #canvasContainer {
        flex: 2;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #customScene {
        position: relative;
        width: 600px;
        height: 600px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.1) 100%) !important;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        border-top: 2px solid rgba(255, 255, 255, 0.8) !important;
        border-left: 2px solid rgba(255, 255, 255, 0.8) !important;
        box-shadow: 
            inset 0 4px 10px rgba(255, 255, 255, 0.6),
            inset 0 -4px 10px rgba(255, 182, 193, 0.2) !important;
        overflow: hidden;
        transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    

    .canvas-placeholder {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        text-align: center;
        color: #df244e;

        font-size: 26px;
        line-height: 1.5;
        pointer-events: none;
        z-index: 1;
        transition: opacity 0.3s ease;
    }

    /* --- DRAGGABLE ITEMS --- */
    .draggableBouquetItem {
        position: absolute;
        cursor: move;
        z-index: 10;
        transition: outline 0.1s ease;
    }

    .draggableBouquetItem:hover {
        outline: 3px solid #B71A3D;
        border-radius: 24px;
    }

    .selectedItem {
        outline: 3px solid #B71A3D !important;
        border-radius: 24px !important;
        box-shadow: none;
    }

    /* --- CONTROL BUTTONS --- */
    .buttons-row {
        display: flex;
        gap: 8px;
        width: 100%;
        margin-top: 8px;
    }

    .buttons-row button,
    .control-btn {
        flex: 1;
        border: none;
        padding: 10px;
        font-size: 13px;
        font-weight: 600;
        font-family: var(--font-ui);
        border-radius: 12px;
        cursor: pointer;
        background: var(--btn-bg);
        color: var(--text-color);
        border: 1.5px solid rgba(255, 182, 217, 0.25);
        box-shadow: 0 2px 6px rgba(255, 182, 193, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s, background 0.3s;
    }

    

    .buttons-row button:hover,
    .control-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(255, 105, 180, 0.18);
    }

    .buttons-row button:active,
    .control-btn:active {
        transform: scale(0.97);
    }

    /* --- PEARL CTA BUTTON --- */
    .shiny-cta {
        outline: none;
        cursor: pointer;
        border: 0;
        position: relative;
        border-radius: 100px;
        background-color: var(--bg-pink);
        transition: all 0.2s ease;
        box-shadow: 
          inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.4),
          inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
          inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.3),
          0 10px 15px -3px rgba(255, 105, 180, 0.3),
          0 4px 6px -2px rgba(255, 105, 180, 0.05);
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        padding: 10px 24px;
    }

    .shiny-cta::before {
        content: "";
        position: absolute;
        left: -15%;
        right: -15%;
        bottom: 25%;
        top: -100%;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.25);
        transition: all 0.3s ease;
        z-index: 1;
        pointer-events: none;
    }

    .shiny-cta::after {
        content: "";
        position: absolute;
        left: 6%;
        right: 6%;
        top: 12%;
        bottom: 40%;
        border-radius: 22px 22px 0 0;
        box-shadow: inset 0 10px 8px -10px rgba(255, 255, 255, 0.6);
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.3) 0%,
          rgba(255, 255, 255, 0) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        transition: all 0.3s ease;
        z-index: 1;
        pointer-events: none;
    }

    .shiny-cta span {
        position: relative;
        z-index: 2;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        color: var(--btn-text-color);
        transition: all 0.2s ease;
        transform: translateY(2%);
    }



    

    .shiny-cta > span::before {
        content: "✧";
        transition: all 0.2s ease;
    }

    .shiny-cta:hover > span::before {
        content: "✦";
    }

    .shiny-cta:hover {
        box-shadow:
          inset 0 0.3rem 0.5rem var(--hover-glow),
          inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
          0 12px 20px rgba(255, 105, 180, 0.4),
          0 4px 8px rgba(255, 105, 180, 0.1);
    }

    .shiny-cta:hover::before {
        transform: translateY(-5%);
    }

    .shiny-cta:hover::after {
        opacity: 0.4;
        transform: translateY(5%);
    }

    .shiny-cta:hover span {
        transform: translateY(-4%);
    }

    .shiny-cta:active {
        transform: translateY(2px);
        box-shadow:
          inset 0 0.3rem 0.5rem var(--hover-glow),
          inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.5),
          0 6px 10px rgba(183, 26, 61, 0.2);
    }

    #toast {

// Cart state
let cart = JSON.parse(sessionStorage.getItem("cart")) || [];

function getCartCount() {
    const cartItems = JSON.parse(sessionStorage.getItem("cart")) || [];
    return cartItems.reduce((total, item) => total + (item.quantity || 1), 0);
}

// DOM Elements
const cartCount = document.getElementById("cartCount");
const toast = document.getElementById("toast");
const cartButton = document.getElementById("cartButton");

// Set initial cart count
cartCount.innerText = getCartCount();

// Track select quantities for 5 flowers locally


// Local quantity state for items on this page
const localQtys = {};

function updateQtyDisplay(flowerId) {
    const qtySpan = document.getElementById(`qtyFlower${flowerId}`);
    if (qtySpan) {
        qtySpan.innerText = localQtys[flowerId] || 1;
    }
}
// Initialize on load
setTimeout(() => {
    for (let i = 1; i <= 35; i++) updateQtyDisplay(i);
}, 100);

// Plus Buttons
document.querySelectorAll(".plusBtn").forEach(button => {

document.addEventListener('DOMContentLoaded', () => {
    // We will dynamically construct the carousel to preserve the existing flowerCard HTML.
    const layouts = document.querySelectorAll('.plushies-layout, .flowers-layout');
    
    layouts.forEach(layout => {
        // Collect all cards
        const cards = Array.from(layout.querySelectorAll('.flowerCard'));
        if (cards.length === 0) return;
        
        // Clear layout and build carousel structure
        layout.innerHTML = '';
        
        const wrapper = document.createElement('div');
        wrapper.className = 'carousel-wrapper';
        
        const prevBtn = document.createElement('button');
        prevBtn.className = 'carousel-btn carousel-prev';
        prevBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
        
        const trackContainer = document.createElement('div');
        trackContainer.className = 'carousel-track-container';
        
        const track = document.createElement('div');
        track.className = 'carousel-track';
        
        cards.forEach(card => {
            const slide = document.createElement('div');
            slide.className = 'carousel-slide';
            slide.appendChild(card);
            track.appendChild(slide);
        });
        
        const nextBtn = document.createElement('button');
        nextBtn.className = 'carousel-btn carousel-next';
        nextBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
        
        trackContainer.appendChild(track);
        wrapper.appendChild(prevBtn);
        wrapper.appendChild(trackContainer);
        wrapper.appendChild(nextBtn);
        
        layout.appendChild(wrapper);
        
        // --- Carousel Logic ---
        let currentIndex = 0;
        let slideInterval;
        
        function updateCarousel() {
            const slides = Array.from(track.children);
            if (slides.length === 0) return;
            
            // To show 3 items at once, slide width is calculated by container
            const slideWidth = slides[0].getBoundingClientRect().width;
            
            // We move exactly by one slide width
            track.style.transform = `translateX(-${currentIndex * slideWidth}px)`;
            
            const containerWidth = trackContainer.getBoundingClientRect().width;
            const visibleSlides = Math.round(containerWidth / slideWidth) || 1;
            const maxIndex = Math.max(0, slides.length - visibleSlides);
            
            // Fix index if resizing
            if (currentIndex > maxIndex) {
                currentIndex = maxIndex;
                track.style.transform = `translateX(-${currentIndex * slideWidth}px)`;
            }
            
            prevBtn.disabled = currentIndex <= 0;
            nextBtn.disabled = currentIndex >= maxIndex;
        }
        
        function nextSlide() {
            const containerWidth = trackContainer.getBoundingClientRect().width;
            const slideWidth = track.children[0].getBoundingClientRect().width;
            const visibleSlides = Math.round(containerWidth / slideWidth) || 1;
            const maxIndex = Math.max(0, track.children.length - visibleSlides);
            
            if (currentIndex < maxIndex) {
                currentIndex++;
            } else {
                currentIndex = 0; // Loop back
            }
            updateCarousel();
        }
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) currentIndex--;
            updateCarousel();
        });
        
        nextBtn.addEventListener('click', () => {
            nextSlide();
        });
        
        // Auto Slideshow removed
        
        window.addEventListener('resize', updateCarousel);
        
        // Initial setup
        setTimeout(() => {
            updateCarousel();
        }, 100);
    });
});

<script defer>

const customScene = document.getElementById("customScene");
const placeholderMsg = document.getElementById("placeholderMsg");

    let selectedItem = null;

    let dragOffsetX = 0;
    let dragOffsetY = 0;

    /* -------------------- */
    /* SPAWNER LOGIC        */
    /* -------------------- */
    function spawnElement(src, type, name) {
        // Hide placeholder
        if (placeholderMsg) {
            placeholderMsg.style.opacity = "0";
            setTimeout(() => {
                if (placeholderMsg) placeholderMsg.style.display = "none";
            }, 300);
        }

        if (window.innerWidth <= 768 && customScene) {
            customScene.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        const el = document.createElement("img");
        
        // Base dimensions: bouquet wrap holder should be larger by default
        let defaultDim = 120;
        if (type === 'holder') {
            // Remove any existing holder so only one can be selected at a time
            const existingHolders = document.querySelectorAll("#customScene .draggableBouquetItem[data-type='holder']");
            existingHolders.forEach(h => h.remove());
            
            defaultDim = 200;
        } else if (type === 'bow') {
            defaultDim = 90;
        }

        el.onload = function() {
            if (type === 'flower' || type === 'leaf') {
                const ratio = el.naturalHeight / (el.naturalWidth || 1);
                let w = 110;
                let h = 110;
                if (ratio > 1) {
                    w = 110 / ratio;
                } else {
                    h = 110 * ratio;
                }
                el.style.width = w + "px";
                el.style.height = h + "px";
                el.style.left = (300 - w / 2) + "px";
                el.style.top = (300 - h / 2) + "px";
            }
        };

        el.src = src;
        el.className = "draggableAccessory draggableBouquetItem";
        el.style.position = "absolute";
        
        if (type !== 'flower' && type !== 'leaf') {
            el.style.width = defaultDim + "px";
            el.style.height = defaultDim + "px";
            
            // Center the element
            el.style.left = (300 - defaultDim / 2) + "px";
            el.style.top = (300 - defaultDim / 2) + "px";
        }
        
        if (type === 'leaf') {
            el.style.zIndex = highestLeafZ++;
        } else {
            el.style.zIndex = highestZ++;
        }
        el.draggable = false;
        
        // Track state
        el.dataset.rotation = "0";
        el.dataset.flip = "1";
        el.dataset.type = type;
        el.dataset.name = name;

        customScene.appendChild(el);
        selectElement(el);
    }

    /* -------------------- */
    /* SELECTION LOGIC      */
    /* -------------------- */
    function updateSelectionUI() {
    const deleteBtn = document.getElementById('itemDeleteBtn');
    const rotateBtn = document.getElementById('itemRotateBtn');
    const resizeBtn = document.getElementById('itemResizeBtn');
    
    if (!selectedItem) {
        if (deleteBtn) deleteBtn.style.display = 'none';
        if (rotateBtn) rotateBtn.style.display = 'none';
        if (resizeBtn) resizeBtn.style.display = 'none';
        return;
    }

    const l = parseFloat(selectedItem.style.left) || 0;
    const t = parseFloat(selectedItem.style.top)  || 0;
    const w = selectedItem.offsetWidth;
    const h = selectedItem.offsetHeight;

    const cx = l + w / 2;
    const cy = t + h / 2;
    
    const angle = parseFloat(selectedItem.dataset.rotation) || 0;
    const rad = angle * Math.PI / 180;
    const flip = parseInt(selectedItem.dataset.flip) || 1;
    
    function getRotatedPoint(dx, dy) {
        let rx = dx * Math.cos(rad) - dy * Math.sin(rad);
        let ry = dx * Math.sin(rad) + dy * Math.cos(rad);
        rx *= flip;
        return {
            x: cx + rx,
            y: cy + ry
        };
    }
    
    const inset = 10;
    const rw = Math.max(16, w - inset * 2);
    const rh = Math.max(16, h - inset * 2);

    const tr = getRotatedPoint(rw/2, -rh/2);
    const bl = getRotatedPoint(-rw/2, rh/2);
    const br = getRotatedPoint(rw/2, rh/2);

    if (deleteBtn) {
        deleteBtn.style.left = (tr.x - 12) + 'px';
        deleteBtn.style.top  = (tr.y - 12) + 'px';
        deleteBtn.style.display = 'flex';
    }
    
    if (rotateBtn) {
        rotateBtn.style.left = (bl.x - 12) + 'px';
        rotateBtn.style.top  = (bl.y - 12) + 'px';
        rotateBtn.style.display = 'flex';
    }
    
    if (resizeBtn) {
        resizeBtn.style.left = (br.x - 12) + 'px';
        resizeBtn.style.top  = (br.y - 12) + 'px';
        resizeBtn.style.display = 'flex';
    }
}

function selectElement(el) {
    selectedItem = el;
    document.querySelectorAll(".draggableBouquetItem, .draggablePlushieItem, .draggableAccessory").forEach(item => {
        item.classList.remove("selectedItem", "selectedAccessory");

}

// Fallback for selectAccessory inside customize.html
function selectAccessory(el) {
    selectElement(el);
}

let isResizing = false;
let isRotating = false;
let resizeStartX = 0, resizeStartY = 0;
let resizeStartW = 0, resizeStartH = 0;
let resizeStartLeft = 0, resizeStartTop = 0;
let rotateStartAngle = 0;
let rotateInitialElementAngle = 0;

function handlePointerDown(e) {
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.type.startsWith('touch')) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }

    if (e.target.closest('#itemDeleteBtn')) return;
    
    if (e.target.closest('#itemResizeBtn') && selectedItem) {
        e.stopPropagation(); 
        if(e.cancelable) e.preventDefault();
        isResizing = true;
        resizeStartX = clientX;
        resizeStartY = clientY;
        resizeStartW = selectedItem.offsetWidth;
        resizeStartH = selectedItem.offsetHeight;
        resizeStartLeft = parseFloat(selectedItem.style.left) || 0;
        resizeStartTop = parseFloat(selectedItem.style.top) || 0;
        return;
    }
    
    if (e.target.closest('#itemRotateBtn') && selectedItem) {
        e.stopPropagation(); 
        if(e.cancelable) e.preventDefault();
        isRotating = true;
        
        const rect = selectedItem.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        rotateStartAngle = Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
        rotateInitialElementAngle = parseFloat(selectedItem.dataset.rotation) || 0;
        return;
    }

    const item = e.target.closest(".draggableBouquetItem, .draggablePlushieItem, .draggableAccessory");
    if (item && customScene.contains(item)) {
        if (!selectedItem || selectedItem !== item) {
            selectElement(item);
        }

        selected = item;
        const rect = item.getBoundingClientRect();
        
        const sceneRect = customScene.getBoundingClientRect();
        const scale = customScene.offsetWidth / sceneRect.width;
        
        dragOffsetX = ((clientX - rect.left) * scale);
        dragOffsetY = ((clientY - rect.top) * scale);
        
        if (typeof highestZ !== 'undefined') {
            if (item.dataset.type === 'leaf') {
                item.style.zIndex = highestLeafZ++;
            } else {
                item.style.zIndex = highestZ++;
            }
        } else {
            item.style.zIndex = parseInt(item.style.zIndex || "100") + 1;
        }
        if(e.cancelable) e.preventDefault();
        customScene.style.cursor = 'grabbing';
    }
}

function handlePointerMove(e) {
    let clientX = e.clientX;
    let clientY = e.clientY;
    if (e.type.startsWith('touch')) {
        if(e.touches.length === 0) return;
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    }

    const sceneW = customScene.clientWidth;
    const sceneH = customScene.clientHeight;

    if (isResizing && selectedItem) {
        const dx = clientX - resizeStartX;
        
        let maxW = Math.min(sceneW - resizeStartLeft, sceneH - resizeStartTop);
        let newW = resizeStartW + dx;
        newW = Math.max(30, Math.min(newW, maxW));
        
        selectedItem.style.width = newW + "px";
        selectedItem.style.height = (newW * (resizeStartH / resizeStartW)) + "px";
        updateSelectionUI();
        if(e.cancelable) e.preventDefault();
        return;
    }
    
    if (isRotating && selectedItem) {
        const rect = selectedItem.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const currentAngle = Math.atan2(clientY - cy, clientX - cx) * 180 / Math.PI;
        
        let angleDiff = currentAngle - rotateStartAngle;
        let newAngle = rotateInitialElementAngle + angleDiff;
        
        selectedItem.dataset.rotation = newAngle;
        let flipStr = selectedItem.dataset.flip === "-1" ? "scaleX(-1) " : "";
        selectedItem.style.transform = flipStr + "rotate(" + newAngle + "deg)";
        updateSelectionUI();
        if(e.cancelable) e.preventDefault();
        return;
    }

    if (!selected) return;

    const rect = customScene.getBoundingClientRect();
    
    const scale = customScene.offsetWidth / rect.width;
    
    let left = ((clientX - rect.left) * scale) - dragOffsetX;
    let top = ((clientY - rect.top) * scale) - dragOffsetY;

    left = Math.max(0, Math.min(left, sceneW - selected.offsetWidth));
    top = Math.max(0, Math.min(top, sceneH - selected.offsetHeight));

    selected.style.left = left + "px";
    selected.style.top = top + "px";
    updateSelectionUI();
    if(e.cancelable) e.preventDefault();
}

function handlePointerUp() {
    selected = null;
    isResizing = false;
    isRotating = false;
    if (selectedItem) {
        customScene.style.cursor = 'grab';
    } else {
        customScene.style.cursor = '';
    }
}

    // Update quantity selector ID and data-flower for buttons
    const minusBtn = card.querySelector(".minusBtn");
    const plusBtn = card.querySelector(".plusBtn");
    const qtySpan = card.querySelector(".flowerQuantity");
    
    if (minusBtn) minusBtn.dataset.flower = fId;
    if (plusBtn) plusBtn.dataset.flower = fId;
    if (qtySpan) qtySpan.id = "qtyFlower" + fId;
    
    // If the qty span value is not 1, maybe reset it? (Optional, let's keep current behavior)
});

</script>

            sidebar.classList.add('open');
            overlay.classList.add('visible');
            menuBtn.classList.add('open');
            menuBtn.textContent = '✕';

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
