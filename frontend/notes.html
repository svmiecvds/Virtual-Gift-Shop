/* --- THEME VARIABLES --- */
:root {
    --bg-gradient: linear-gradient(135deg, #fce0e5 0%, #fac5cf 40%, #fac5cf 100%);
    --body-bg: #fef2f4;
    --panel-bg: #fce0e5;
    --popup-bg: #fce0e5;
    --receipt-bg: #fef2f4;
    --card-bg: #ffffff;
    --text-color: #B71A3D;
    --heading-color: #B71A3D;
    --btn-bg: #ffffff;
    --btn-text: #B71A3D;
    --cart-btn-bg: #B71A3D;
    --cart-btn-shadow: #B71A3D;
    --glow-color: #B71A3D;
    --glow-soft: #fac5cf;
    --toast-bg: #B71A3D;
    --receipt-shadow: #fac5cf;
    --shelf-overlay: rgba(255,255,255,0.0);
    --font-body: 'Quicksand', sans-serif;
    --font-heading: 'Pinyon Script', cursive;
    --font-ui: 'Fredoka', sans-serif;
    --font-nav: 'Inter', sans-serif;
}



/* --- BASE --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html { scrollbar-width: none; background-color: #fef2f4; /* prevent white overscroll on iOS */ }
html::-webkit-scrollbar { display: none; }


html::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: -999;
    background-image: url('assets/notesbg.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    pointer-events: none;
    transform: translateZ(0);
    will-change: transform;
}

body,
body.receiptPage,
body.giftPage {
    color: var(--text-color);
    background: transparent !important;
    overflow-x: hidden !important;
    overflow-y: auto !important;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.5s ease, color 0.5s ease;
    font-family: var(--font-body);
    font-weight: 500;
}

.sidebar-panel {
    display: none;
    /* --- controlled by JS --- */
    background: var(--popup-bg);
    padding: 25px;
    border-radius: 25px;
    text-align: center;
    transition: background 0.5s ease, box-shadow 0.5s ease;
}

#shelf {
    width: 1000px;
    height: 800px;
    background: url("shelf.webp");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    position: relative;
    margin: 0 auto;

/* --- Shelf stays strictly center aligned --- */
}

.character {
    position: absolute;
    width: 170px;
    cursor: pointer;
    transition: .25s;
}

.character:hover {
    transform: scale(1.05);
}

/* --- CHECKOUT BUTTON --- */


/* --- TOAST --- */
#toast {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--toast-bg);
    color: white;
    padding: 15px 25px;
    border-radius: 50px;
    z-index: 9999;
    transition: background 0.5s ease;
}

/* --- Highlight selected gift element --- */
.gifSelected {
    outline: 3px solid #B71A3D !important;
    outline-offset: 3px;
}

/* --- Gift text element --- */
.giftText {
    min-width: 80px;
    font-size: 22px;
    color: var(--heading-color);
    user-select: none;
    cursor: move;
    white-space: pre-wrap;
    word-break: break-word;
}

/* --- CUSTOM ALIGNMENTS --- */
.checkoutTitle, .customizeTitle {
    text-align: center !important;
    font-family: var(--font-heading);
    color: var(--heading-color);
    margin-top: 100px;
    margin-bottom: 25px;
    font-size: 50px;
    text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4);
    font-weight: bold;
}



/* --- NAVBAR --- */
#storeNavbar {
    background: url(\'assets/kisses-bg.webp\') center/cover no-repeat !important;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(255, 228, 241, 0.95);
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 30px;
    z-index: 999;
    border-bottom: none;
    box-shadow: 0 4px 15px rgba(255, 105, 180, 0.1);
    padding: 10px 30px;
    box-sizing: border-box;
}



.navLink {
    font-size: 16px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: white;
    text-decoration: none;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.5px;
}

.navLink:hover {
    color: white;
    transform: translateY(-2px);
    opacity: 0.9;
}

.navLink.active {
    color: white;
    font-weight: 800;
    border-bottom: 3px solid var(--heading-color);
    padding-bottom: 2px;
}



/* --- Header Text styling --- */
.storeHeader {
    text-align: center;
    margin-top: 100px;
    margin-bottom: 20px;
    color: var(--heading-color);
    font-family: var(--font-heading);
    font-size: 56px;
    text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4);
    font-weight: bold;
}



/* --- BACK TO SHOP BTN --- */



.spawner-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    justify-items: center;
}

/* --- Big chosen box canvas - a tad bit smaller (600x600px) --- */

#mainBox {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.canvas-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    color: #df244e;
    font-family: var(--font-heading);
    font-size: 26px;
    line-height: 1.5;
    pointer-events: none;
    z-index: 1;
    transition: opacity 0.3s ease;
}

/* --- Bubbly option elements inside selection panel --- */
.box-option {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px 20px;
    background: var(--btn-bg);
    border-radius: 20px;
    cursor: pointer;
    margin-bottom: 12px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    width: 100%;
}

.box-option:hover {
    transform: translateY(-3px) scale(1.02);
    border-color: #B71A3D;
    box-shadow: 0 5px 12px rgba(183, 26, 61, 0.2);
}

.box-option.active {
    background: #fac5cf;
    border-color: #B71A3D;
    box-shadow: none;
}

.box-option img {
    width: 45px;
    height: 32px;
    object-fit: contain;
}

.box-option span {
    font-size: 16px;
    font-family: var(--font-ui);
    font-weight: 600;
    color: var(--text-color);
}

.box-option.active span {
    color: #5a0035;
}







/* --- Customization Buttons Placed Side-by-Side --- */
.buttons-row {
    display: flex;
    gap: 10px;
    width: 100%;
    margin-top: 10px;
}

.buttons-row button {
    flex: 1;
    margin: 0 !important;
    padding: 12px 6px !important;
    font-size: 14px !important;
    border-radius: 25px !important;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: #ffffff;
    color: #5a0035;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
}

.buttons-row button:hover {
    transform: scale(1.05);
}
.draggableTreat {
    position: absolute;
    width: 70px;
    height: 70px;
    object-fit: contain;
    cursor: move;
    z-index: 10;
    transition: transform 0.1s ease;
}

/* --- PEARL STARDUST BUTTON DESIGN --- */
:root {
    --bg-pink: #fac5cf;
    --hover-glow: rgba(250, 197, 207, 0.6);
    --hover-glow-soft: rgba(183, 26, 61, 0.8);
    --btn-text-color: #5a0035;
}



.shiny-cta {
    outline: none;
    cursor: pointer;
    border: 0;
    position: relative;
    border-radius: 100px;
    background-color: var(--bg-pink);
    transition: all 0.2s ease;
    box-shadow: 
      inset 0 0.3rem 0.9rem rgba(255, 255, 255, 0.4),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
      inset 0 -0.4rem 0.9rem rgba(255, 255, 255, 0.3),
      0 10px 15px -3px rgba(255, 105, 180, 0.3),
      0 4px 6px -2px rgba(255, 105, 180, 0.05);
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    padding: 10px 24px;
}

.shiny-cta::before {
    content: "";
    position: absolute;
    left: -15%;
    right: -15%;
    bottom: 25%;
    top: -100%;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.25);
    transition: all 0.3s ease;
    z-index: 1;
    pointer-events: none;
}

.shiny-cta::after {
    content: "";
    position: absolute;
    left: 6%;
    right: 6%;
    top: 12%;
    bottom: 40%;
    border-radius: 22px 22px 0 0;
    box-shadow: inset 0 10px 8px -10px rgba(255, 255, 255, 0.6);
    background: linear-gradient(
      180deg,
      rgba(255, 255, 255, 0.3) 0%,
      rgba(255, 255, 255, 0) 50%,
      rgba(255, 255, 255, 0) 100%
    );
    transition: all 0.3s ease;
    z-index: 1;
    pointer-events: none;
}

.shiny-cta span {
    position: relative;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    color: var(--btn-text-color);
    transition: all 0.2s ease;
    transform: translateY(2%);
}

.shiny-cta > span::before {
    content: "✧";
    transition: all 0.2s ease;
}

.shiny-cta:hover > span::before {
    content: "✦";
}

.shiny-cta:hover {
    box-shadow:
      inset 0 0.3rem 0.5rem var(--hover-glow),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.4),
      0 12px 20px rgba(255, 105, 180, 0.4),
      0 4px 8px rgba(255, 105, 180, 0.1);
}

.shiny-cta:hover::before {
    transform: translateY(-5%);
}

.shiny-cta:hover::after {
    opacity: 0.4;
    transform: translateY(5%);
}

.shiny-cta:hover span {
    transform: translateY(-4%);
}

.shiny-cta:active {
    transform: translateY(2px);
    box-shadow:
      inset 0 0.3rem 0.5rem var(--hover-glow),
      inset 0 -0.1rem 0.3rem rgba(0, 0, 0, 0.5),
      0 6px 10px rgba(183, 26, 61, 0.2);
}



@keyframes gradient-angle {
  to {
    --gradient-angle: 360deg;
  }
}

@keyframes shimmer {
  to {
    rotate: 360deg;
  }
}

@keyframes breathe {
  from, to {
    scale: 1;
  }
  50% {
    scale: 1.2;
  }
}

        .colour-swatch.swatch-active { outline: 3px solid white; outline-offset: 2px; transform: scale(1.15); }
    </style>


<script defer>
    let cart = JSON.parse(sessionStorage.getItem("cart")) || [];
    
    const mainNote = document.getElementById('mainNote');
    const placeholderMsg = document.getElementById('placeholderMsg');

    const noteText = document.getElementById('noteText');
    const canvasContent = document.getElementById('canvasContent');
    const customScene = document.getElementById('customScene');
    const itemDeleteBtn = document.getElementById('itemDeleteBtn');
    const itemRotateBtn = document.getElementById('itemRotateBtn');
    const itemResizeBtn = document.getElementById('itemResizeBtn');

    let stickers = [];
    let noteData = {
        src: 'assets/final page/note1.webp',
        text: '',
        font: 'Pacifico',
        color: '#B71A3D'
    };
    
    const cartCountEl = document.getElementById('cartCount');
    if (cartCountEl) cartCountEl.innerText = cart.length;
    
    let selectedElement = null;

    // Note Colour swatches
    document.querySelectorAll('.note-swatch').forEach(swatch => {
        swatch.addEventListener('click', () => {
            const src = swatch.dataset.src;
            noteData.src = src;
            mainNote.src = src;
            document.querySelectorAll('.note-swatch').forEach(s => s.classList.remove('swatch-active'));
            swatch.classList.add('swatch-active');
            
            // Remove placeholder if present
            if (placeholderMsg.style.display !== 'none') {
                placeholderMsg.style.display = 'none';
                document.getElementById('noteTextarea').focus();
            }
            if (window.innerWidth <= 768) {
                customScene.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    });

    // Sticker Selection
    document.querySelectorAll('.stickerTemplate').forEach(el => {
        el.addEventListener('click', () => {
            if (!noteData.src) {
                alert("Please select a note first to place stickers on!");
                return;
            }
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.src = el.dataset.src;
            img.className = 'draggableSticker';
            img.style.left = '50%';
            img.style.top = '50%';
            
            img.dataset.angle = 0;
            img.dataset.scale = 1;
            img.style.setProperty('--scale', 1);
            img.style.transform = `translate(-50%, -50%) rotate(0rad) scale(1)`;
            
            canvasContent.appendChild(img);
            stickers.push(img);
            selectElement(img);
            if (window.innerWidth <= 768) {
                customScene.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    });

    const noteTextarea = document.getElementById('noteTextarea');
    const textColorPicker = document.getElementById('textColorPicker');
    const colorPopover = document.getElementById('colorPopover');

    // Set initial Pacifico font & colour on textarea
    noteTextarea.style.fontFamily = "'Pacifico', cursive";
    noteTextarea.style.color = noteData.color;

    // Live typing — text appears directly on the note and stops if it exceeds page limits
    let lastValidNoteText = noteTextarea.value;
    noteTextarea.addEventListener('input', () => {
        if (noteTextarea.scrollHeight > noteTextarea.clientHeight || noteTextarea.scrollWidth > noteTextarea.clientWidth) {
            noteTextarea.value = lastValidNoteText; // Revert to prevent vertical/horizontal overflow
        } else {
            lastValidNoteText = noteTextarea.value;
        }
        noteData.text = noteTextarea.value;
    });



    // Live colour change via native picker applies instantly to textarea text
    textColorPicker.addEventListener('input', () => {
        noteData.color = textColorPicker.value;
        noteTextarea.style.color = noteData.color;
        // Reflect active state on swatches
        document.querySelectorAll('.colour-swatch').forEach(s => s.classList.remove('swatch-active'));
    });

    // Colour swatches in left panel — click to instantly change font colour
    document.querySelectorAll('.font-swatch').forEach(swatch => {
        swatch.addEventListener('click', () => {
            const color = swatch.dataset.color;
            noteData.color = color;
            noteTextarea.style.color = color;
            textColorPicker.value = color;
            document.querySelectorAll('.font-swatch').forEach(s => s.classList.remove('swatch-active'));
            swatch.classList.add('swatch-active');
            if (window.innerWidth <= 768) {
                customScene.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
    });

    // Save Changes
    document.getElementById('saveCustomization').addEventListener('click', () => {
        if (!noteData.src) {
            alert('Please compose a note before saving!');
            return;
        }
        
        const noteId = Math.random().toString(36).substr(2, 9);
        
        const mRect = mainNote.getBoundingClientRect();
        
        // Calculate true rendered size due to object-fit: contain
        const imgRatio = mainNote.naturalWidth / mainNote.naturalHeight;
        const containerRatio = mRect.width / mRect.height;
        
        let renderWidth = mRect.width;
        let renderHeight = mRect.height;
        
        if (imgRatio > containerRatio) {
            renderHeight = mRect.width / imgRatio;
        } else {
            renderWidth = mRect.height * imgRatio;
        }
        
        const noteWidth = renderWidth;
        const noteHeight = renderHeight;
        
        const mCenterX = mRect.left + mRect.width / 2;
        const mCenterY = mRect.top + mRect.height / 2;
        
        // Unscaled visual top-left of the actual rendered image
        const mTopLeftX = mCenterX - (noteWidth / 2);
        const mTopLeftY = mCenterY - (noteHeight / 2);
        
        let textDetails = null;
        if (noteData.text && noteData.text.trim()) {
            const tRect = noteTextarea.getBoundingClientRect();
            const tCenterX = tRect.left + tRect.width / 2;
            const tCenterY = tRect.top + tRect.height / 2;
            const textLeft = tCenterX - mTopLeftX;
            const textTop = tCenterY - mTopLeftY;
            textDetails = {
                text: noteData.text,
                fontFamily: 'Pacifico',
                color: noteData.color,
                left: (textLeft / noteWidth) * 100,
                top: (textTop / noteHeight) * 100,
                width: (noteTextarea.offsetWidth / noteWidth) * 100,
                height: (noteTextarea.offsetHeight / noteHeight) * 100,
                fontSize: (parseFloat(window.getComputedStyle(noteTextarea).fontSize) / noteWidth) * 100,
                angle: 0,
                scale: 1
            };
        }
        
        const embeddedStickers = stickers.map(s => {
            const sRect = s.getBoundingClientRect();
            const sCenterX = sRect.left + sRect.width / 2;
            const sCenterY = sRect.top + sRect.height / 2;
            const stickerLeft = sCenterX - mTopLeftX;
            const stickerTop = sCenterY - mTopLeftY;
            return {
                src: s.src,
                left: (stickerLeft / noteWidth) * 100,
                top: (stickerTop / noteHeight) * 100,
                width: (s.offsetWidth / noteWidth) * 100,
                angle: s.dataset.angle || 0,
                scale: s.dataset.scale || 1
            };
        });
        
        cart.push({
            id: noteId,
            type: 'note',
            src: noteData.src,
            angle: mainNote.dataset.angle || 0,
            scale: mainNote.dataset.scale || 1,
            noteTextDetails: textDetails,
            stickers: embeddedStickers,
            quantity: 1,
            name: 'Custom Note'
        });
        
        sessionStorage.setItem("cart", JSON.stringify(cart));
        window.location.href = "checkout.html";
    });

    // Dragging / Rotate / Resize Logic
    let isDragging = false;
    let isRotating = false;
    let isResizing = false;
    let dragStartX, dragStartY;
    let initialLeft, initialTop;
    let startAngle = 0;
    let startScale = 1;

    function selectElement(el) {
        if (selectedElement) {
            selectedElement.classList.remove('canvas-selected');
        }
        selectedElement = el;
        if (el) {
            el.classList.add('canvas-selected');
            updateControls();
        } else {
            itemDeleteBtn.style.display = 'none';
            itemRotateBtn.style.display = 'none';
            itemResizeBtn.style.display = 'none';
        }
    }

    function updateControls() {
        if (!selectedElement) {
            itemDeleteBtn.style.display = 'none';
            itemRotateBtn.style.display = 'none';
            itemResizeBtn.style.display = 'none';
            return;
        }
        
        const rect = selectedElement.getBoundingClientRect();
        const parentRect = customScene.getBoundingClientRect();
        
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        
        const scale = parseFloat(selectedElement.dataset.scale) || 1;
        const w = selectedElement.offsetWidth * scale;
        const h = selectedElement.offsetHeight * scale;
        
        const rotRad = parseFloat(selectedElement.dataset.angle) || 0;
        
        function getRotatedPos(dx, dy) {
            const rx = cx + dx * Math.cos(rotRad) - dy * Math.sin(rotRad);
            const ry = cy + dx * Math.sin(rotRad) + dy * Math.cos(rotRad);
            return { x: rx, y: ry };
        }
        
        const offsetX = parentRect.left;
        const offsetY = parentRect.top;
        
        const delPos = getRotatedPos(w/2, -h/2);
        itemDeleteBtn.style.left = (delPos.x - offsetX - 16) + 'px';
        itemDeleteBtn.style.top = (delPos.y - offsetY - 16) + 'px';
        itemDeleteBtn.style.display = 'block';

        const rotPos = getRotatedPos(-w/2, h/2);
        itemRotateBtn.style.left = (rotPos.x - offsetX - 16) + 'px';
        itemRotateBtn.style.top = (rotPos.y - offsetY - 16) + 'px';
        itemRotateBtn.style.display = 'block';

        const resPos = getRotatedPos(w/2, h/2);
        itemResizeBtn.style.left = (resPos.x - offsetX - 16) + 'px';
        itemResizeBtn.style.top = (resPos.y - offsetY - 16) + 'px';
        itemResizeBtn.style.display = 'block';
    }

    function getPointerEvent(e) {
        if (e.type.startsWith('touch')) {
            return e.touches.length > 0 ? e.touches[0] : null;
        }
        return e;
    }

    function handlePointerDown(e) {
        const ptr = getPointerEvent(e);
        if (!ptr && e.type !== 'touchend' && e.type !== 'touchcancel') return;
        const clientX = ptr ? ptr.clientX : 0;
        const clientY = ptr ? ptr.clientY : 0;

        if (e.target.closest('#itemDeleteBtn')) {
            if (selectedElement && selectedElement.classList.contains('draggableSticker')) {
                selectedElement.remove();
                stickers = stickers.filter(s => s !== selectedElement);
            } else if (selectedElement === noteText) {
                noteText.style.display = 'none';
                noteData.text = '';
            } else if (selectedElement === mainNote) {
                mainNote.style.display = 'none';
                noteData.src = null;
                placeholderMsg.style.display = 'flex';
                addTextBtn.style.display = 'none';
                noteText.style.display = 'none';
                stickers.forEach(s => s.remove());
                stickers = [];
            }
            selectElement(null);
            return;
        }

        if (e.target.closest('#itemRotateBtn')) {
            isRotating = true;
            const rect = selectedElement.getBoundingClientRect();
            dragStartX = rect.left + rect.width / 2;
            dragStartY = rect.top + rect.height / 2;
            startAngle = Math.atan2(clientY - dragStartY, clientX - dragStartX);
            if(e.cancelable) e.preventDefault();
            return;
        }

        if (e.target.closest('#itemResizeBtn')) {
            isResizing = true;
            const rect = selectedElement.getBoundingClientRect();
            dragStartX = rect.left + rect.width / 2;
            dragStartY = rect.top + rect.height / 2;
            startScale = parseFloat(selectedElement.dataset.scale || 1);
            selectedElement.dataset.startDist = Math.hypot(clientX - dragStartX, clientY - dragStartY);
            if(e.cancelable) e.preventDefault();
            return;
        }

        if (e.target.classList.contains('draggableSticker') || e.target === noteText || e.target === mainNote) {
            isDragging = true;
            selectElement(e.target);
            dragStartX = clientX;
            dragStartY = clientY;
            initialLeft = selectedElement.offsetLeft;
            initialTop = selectedElement.offsetTop;
            if(e.cancelable) e.preventDefault();
        } else if (!e.target.closest('#addTextBtn') && !e.target.closest('.canvas-placeholder')) {
            selectElement(null);
        }
    }

    function handlePointerMove(e) {
        if (!selectedElement) return;
        const ptr = getPointerEvent(e);
        if (!ptr) return;
        const clientX = ptr.clientX;
        const clientY = ptr.clientY;

        if (isRotating) {
            const angle = Math.atan2(clientY - dragStartY, clientX - dragStartX);
            const currentAngle = parseFloat(selectedElement.dataset.angle || 0);
            const delta = angle - startAngle;
            const newAngle = currentAngle + delta;
            
            selectedElement.dataset.angle = newAngle;
            const scale = selectedElement.dataset.scale || 1;
            selectedElement.style.transform = `translate(-50%, -50%) rotate(${newAngle}rad) scale(${scale})`;
            
            startAngle = angle;
            updateControls();
            if(e.cancelable) e.preventDefault();
        } else if (isResizing) {
            const dist = Math.hypot(clientX - dragStartX, clientY - dragStartY);
            const startDist = parseFloat(selectedElement.dataset.startDist);
            
            let newScale = startScale * (dist / startDist);
            newScale = Math.max(0.2, Math.min(newScale, 5));
            
            selectedElement.dataset.scale = newScale;
            selectedElement.style.setProperty('--scale', newScale);
            const angle = selectedElement.dataset.angle || 0;
            selectedElement.style.transform = `translate(-50%, -50%) rotate(${angle}rad) scale(${newScale})`;
            
            updateControls();
            if(e.cancelable) e.preventDefault();
        } else if (isDragging) {
            const dx = clientX - dragStartX;
            const dy = clientY - dragStartY;
            
            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;
            
            // Constrain dragging to the canvas boundaries
            const sceneWidth = customScene.offsetWidth;
            const sceneHeight = customScene.offsetHeight;
            
            const scale = parseFloat(selectedElement.dataset.scale) || 1;
            const w = selectedElement.offsetWidth * scale;
            const h = selectedElement.offsetHeight * scale;
            
            newLeft = Math.max(w/2, Math.min(newLeft, sceneWidth - w/2));
            newTop = Math.max(h/2, Math.min(newTop, sceneHeight - h/2));
            
            selectedElement.style.left = newLeft + 'px';
            selectedElement.style.top = newTop + 'px';
            
            updateControls();
            if(e.cancelable) e.preventDefault();
        }
    }

    function handlePointerUp() {
        isDragging = false;
        isRotating = false;
        isResizing = false;
    }

    customScene.addEventListener('mousedown', handlePointerDown);
    customScene.addEventListener('touchstart', handlePointerDown, { passive: false });

    document.addEventListener('mousemove', handlePointerMove);
    document.addEventListener('touchmove', handlePointerMove, { passive: false });

    document.addEventListener('mouseup', handlePointerUp);
    document.addEventListener('touchend', handlePointerUp);
    document.addEventListener('touchcancel', handlePointerUp);

    function updateTextareaStyles() {
        if (!mainNote || !mainNote.complete) return;
        const mRect = mainNote.getBoundingClientRect();
        if (mRect.width === 0) return;
        const imgRatio = mainNote.naturalWidth / (mainNote.naturalHeight || 1);
        const containerRatio = mRect.width / (mRect.height || 1);
        let renderWidth = mRect.width;
        if (imgRatio > containerRatio) {
            // Note image is wider, height is scaled down
            // renderWidth remains mRect.width
        } else {
            // Note image is taller, width is scaled down
            renderWidth = mRect.height * imgRatio;
        }
        
        // Match 7.5cqw from gift.html
        const newFontSize = renderWidth * 0.075;
        noteTextarea.style.fontSize = Math.max(12, newFontSize) + "px";
    }

    window.addEventListener('resize', updateTextareaStyles);
    mainNote.addEventListener('load', updateTextareaStyles);
    // Observe customScene resizes in case it changes dynamically
    if (window.ResizeObserver) {
        new ResizeObserver(updateTextareaStyles).observe(customScene);
    } else {
        setTimeout(updateTextareaStyles, 100);
    }
    updateTextareaStyles();

</script>

            sidebar.classList.add('open');
            overlay.classList.add('visible');
            menuBtn.classList.add('open');
            menuBtn.textContent = '✕';
        }
        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('visible');
            menuBtn.classList.remove('open');
            menuBtn.textContent = '☰';
        }
        menuBtn.addEventListener('click', function() {
            sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });
        overlay.addEventListener('click', closeSidebar);
