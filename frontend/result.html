<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift For You | The Gifting Co.</title>
    <link rel="icon" type="image/png" href="/assets/favicon.webp">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ribeye&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --toast-bg: #B71A3D;
            --heading-color: #B71A3D;
        }

        html { scrollbar-width: none; background-color: #fef2f4; /* prevent white overscroll on iOS */ }
html::-webkit-scrollbar { display: none; }
html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        html::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -999;
            background-image: url('/assets/giftbg.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: transparent !important;
            display: flex;
            flex-direction: column;
        }

        .giftHeader {
            text-align: center !important;
            margin-top: 100px !important;
            margin-bottom: 20px !important;
            color: #B71A3D !important;
            font-family: 'Pinyon Script', cursive !important;
            font-size: 56px !important;
            text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4) !important;
            font-weight: bold !important;
            line-height: 1.2 !important;
        }

        @media (max-width: 768px) {
            html::before {
                background-image: url('/assets/mobilegiftbg.webp') !important;
            }
            body {
                height: 100vh !important;
                width: 100vw !important;
                overflow: hidden !important;
            }
            /* On mobile, the giftScene fills the full viewport so we can
               position items using absolute coords relative to the screen */
            #giftContainer {
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                gap: 0 !important;
            }
            #giftScene {
                position: absolute !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                flex: none !important;
            }
            .giftHeader {
                font-size: 48px !important;
                margin-top: 20px !important;
                margin-bottom: 10px !important;
                white-space: nowrap !important;
                position: relative;
                z-index: 20;
            }
        }

        /* Gift elements */
        .giftEl {
            position: absolute;
        }

        .giftText {
            min-width: 60px;
            font-size: 18px;
            color: #B71A3D;
            user-select: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .noteText {
            position: absolute;
            top: 12%;
            left: 10%;
            width: 75%;
            height: 70%;
            overflow: hidden;
            text-align: center;
            word-wrap: break-word;
            font-size: 18px;
            user-select: none;
        }




        /* Glass tile footer */
        .site-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 32px;
            padding: 0 20px;
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
            background: #900C3F;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
        }

        .site-footer a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.6);
            transition: opacity 0.2s ease;
            pointer-events: auto;
            margin: 0 2px;
        }

        .site-footer a:hover { opacity: 0.7; }

        /* Loading state */
        #loadingMsg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: #ffffff;
            text-align: center;
            z-index: 9999; /* Below envelope */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        
        /* New Envelope Animation Styles */
        .envelope-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #5c0017; /* dark red */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }

        .envelope-full {
            cursor: pointer;
            position: relative;
            width: 90%;
            max-width: 600px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .envelope-full:hover {
            transform: scale(1.03);
        }

        .envelope-full img, .env-top, .env-bottom {
            width: 100%;
            height: auto;
            display: block;
        }

        .envelope-parts {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            pointer-events: none;
            display: none;
            z-index: 1;
        }

        .env-top, .env-bottom {
            position: absolute;
            left: 0;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 1.2s ease;
        }

        /* Initial positions - they overlay exactly */
        .env-top {
            top: 0;
            transform: translateY(-50%);
        }
        
        .env-bottom {
            top: 0;
            transform: translateY(-50%);
        }

        /* Animation states */
        .env-top.open {
            transform: translateY(-150%);
            opacity: 0;
        }

        .env-bottom.open {
            transform: translateY(50%);
            opacity: 0;
        }

        .envelope-overlay.fading {
            opacity: 0;
            pointer-events: none;
        }

        .env-instruction {
            position: absolute;
            bottom: -40px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-size: 18px;
            opacity: 0.8;
            pointer-events: none;
        }

    
        @media (min-width: 769px) {
            .envelope-overlay {
                background: transparent !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }

            .envelope-full, .envelope-parts {
                width: 100vw;
                max-width: 100vw;
                height: 100vh;
                top: 0;
                left: 0;
                transform: none;
            }
            .envelope-full img, .env-top, .env-bottom {
                width: 100vw;
                height: 100vh;
                object-fit: fill;
            }
            .env-top, .env-bottom {
                top: 0;
                transform: none;
            }
            .env-top.open {
                transform: translateY(-100%);
                opacity: 0;
            }
            .env-bottom.open {
                transform: translateY(100%);
                opacity: 0;
            }
            .envelope-full:hover {
                transform: none;
            }
            .env-instruction {
                bottom: 20px;
                font-size: 24px;
            }
        }
</style>
</head>

<body class="env-opening">

    <!-- New Envelope Animation Overlay -->
    <div id="envelope-overlay" class="envelope-overlay">
        <div class="envelope-full" id="envelopeFull">
            <img src="assets/envelope-full.png" alt="Envelope">

        </div>

        </div>
    </div>


    

    <!-- Title Header -->
    <h1 class="giftHeader">A Gift for You.</h1>

    <!-- Stationary gift layout exactly like gift.html -->
    <div id="giftContainer" style="display: flex; flex: 1; min-height: 0; align-items: center; gap: 20px; justify-content: center; width: 85%; max-width: 900px; margin: 0 auto; padding-top: 10px; padding-bottom: 20px; position: relative; z-index: 10;">
        <div id="giftScene" style="flex: 1; height: 55vh; position: relative; overflow: visible;">
            <!-- Arranged elements will be reconstructed here dynamically -->
        </div>
    </div>


    <!-- Glass tile footer -->
    <footer class="site-footer">
        &copy; 2026 | &#9825; Made with <a href="https://thegifting.vercel.app" target="_blank" rel="noopener noreferrer">The Gifting Co.</a>
    </footer>

    <!-- Loading message -->
    <div id="loadingMsg">Loading your gift.</div>

    <script defer>
        const giftScene = document.getElementById('giftScene');
        const loadingMsg = document.getElementById('loadingMsg');

        /* ---------- src helpers ---------- */
        function resolveMainSrc(src) {
            if (!src) return '';
            if (src.startsWith('data:')) return src;
            let path = src.replace(/\\/g, '/');
            const i = path.toLowerCase().indexOf('assets/');
            if (i !== -1) {
                const p = path.substring(i);
                return p.startsWith('/') ? '.' + p : './' + p;
            }
            return src;
        }

        function resolveAccessorySrc(src) {
            if (!src) return '';
            let path = src.replace(/\\/g, '/');
            const i = path.toLowerCase().indexOf('assets/');
            if (i !== -1) {
                const p = path.substring(i);
                return p.startsWith('/') ? '.' + p : './' + p;
            }
            const filename = path.split('/').pop();
            if (filename.includes('custom'))  return './assets/plushies/' + filename;
            if (filename.includes('flower')  || filename.includes('bow') || filename.includes('holder')) return './assets/flowers/' + filename;
            return './assets/' + filename;
        }

        /* ---------- load gift ---------- */
        let savedLayout = [];

        async function initViewer() {
            let docId = new URLSearchParams(window.location.search).get('id');
            if (!docId) {
                const parts = window.location.pathname.split('/');
                docId = parts[parts.length - 1];
            }
            if (!docId || docId === 'result.html' || docId === 'gift') {
                loadingMsg.textContent = 'Gift Expired';
                loadingMsg.style.fontFamily = "'Pinyon Script', cursive";
                loadingMsg.style.fontSize = "56px";
                return;
            }
            try {
                const response = await fetch(`/api/getGift?id=${docId}`);
                if (response.ok) {
                    const giftData = await response.json();
                    savedLayout = giftData.components || [];
                    if (giftData.recipientName) {
                        const titleEl = document.querySelector('.checkoutTitle');
                        if (titleEl) titleEl.textContent = `A Gift For ${giftData.recipientName}`;
                    }
                    loadingMsg.remove();
                    renderGift();
                } else {
                    loadingMsg.textContent = 'Gift Expired';
                    loadingMsg.style.fontFamily = "'Pinyon Script', cursive";
                    loadingMsg.style.fontSize = "56px";
                }
            } catch (e) {
                console.error('Error loading gift:', e);
                loadingMsg.textContent = 'Error loading gift.';
            }
        }

        initViewer();

        /* ---------- render ---------- */
        function renderGift() {
            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                // === MOBILE PLACEMENT SNIPPET ===
                // Calculate the exact bow boundary on the mobile background (mobilegiftbg.webp = 941x1672)
                // using the same cover-scaling math as gift.html's updateBowBoundary.
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const imgW = 941, imgH = 1672;
                const imgRatio = imgW / imgH;
                const winRatio = vw / vh;

                let scaledW, scaledH, offsetX, offsetY;
                if (winRatio > imgRatio) {
                    // Window wider than image — image fills width, height is cropped
                    scaledW = vw;
                    scaledH = vw / imgRatio;
                    offsetX = 0;
                    offsetY = (vh - scaledH) / 2;
                } else {
                    // Window narrower — image fills height, width is cropped
                    scaledH = vh;
                    scaledW = vh * imgRatio;
                    offsetX = (vw - scaledW) / 2;
                    offsetY = 0;
                }

                // Exact bow centers from image analysis (px in original image):
                // Top=410, Bottom=1286, Left=148, Right=809  (image is 941x1672)
                const bowLeft   = offsetX + scaledW * (148 / imgW);
                const bowRight  = offsetX + scaledW * (809 / imgW);
                const bowTop    = offsetY + scaledH * (410 / imgH);
                const bowBottom = offsetY + scaledH * (1286 / imgH);

                const bowW = bowRight - bowLeft;   // usable width between bows
                const bowH = bowBottom - bowTop;   // usable height between bows
                const bowCX = bowLeft + bowW / 2;  // centre X of bow zone
                const bowCY = bowTop  + bowH / 2;  // centre Y of bow zone

                // The desktop gift scene is saved with coords relative to its own scene rect.
                // Find the bounding box of all items so we can centre them as a group.
                let minL = Infinity, minT = Infinity, maxR = -Infinity, maxB = -Infinity;
                savedLayout.forEach(item => {
                    const l = parseFloat(item.left) || 0;
                    const t = parseFloat(item.top)  || 0;
                    const w = parseFloat(item.width) || 100;
                    const h = parseFloat(item.height) || 100;
                    minL = Math.min(minL, l);
                    minT = Math.min(minT, t);
                    maxR = Math.max(maxR, l + w);
                    maxB = Math.max(maxB, t + h);
                });
                const groupW = maxR - minL || 1;
                const groupH = maxB - minT || 1;

                // Scale factor: fit the group into the bow zone (with a little padding)
                const pad = 0.85; // use 85% of the bow zone to leave breathing room
                const scale = Math.min((bowW * pad) / groupW, (bowH * pad) / groupH, 1);

                // Offset so the scaled group is centred on the bow zone centre
                const groupCX = (minL + maxR) / 2;
                const groupCY = (minT + maxB) / 2;

                savedLayout.forEach(item => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'giftEl';
                    wrapper.style.position = 'absolute';

                    const origL = parseFloat(item.left)  || 0;
                    const origT = parseFloat(item.top)   || 0;

                    // Translate relative to group centre, scale, then shift to bow centre
                    const newLeft = bowCX + (origL - groupCX) * scale;
                    const newTop  = bowCY + (origT - groupCY) * scale;

                    wrapper.style.left = newLeft + 'px';
                    wrapper.style.top  = newTop  + 'px';

                    if (item.width)  wrapper.style.width  = (parseFloat(item.width)  * scale) + 'px';
                    if (item.height && item.height !== 'auto') wrapper.style.height = (parseFloat(item.height) * scale) + 'px';
                    wrapper.style.zIndex = item.zIndex;
                    wrapper.style.transform = `rotate(${item.rotation || 0}deg) scaleX(${item.flip || 1})`;

                    renderGiftItemContents(wrapper, item, scale, scale);
                    giftScene.appendChild(wrapper);
                });
            } else {
                // === DESKTOP PLACEMENT SNIPPET ===
                savedLayout.forEach(item => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'giftEl';
                    wrapper.style.position = 'absolute';

                    const currentSceneW = giftScene.offsetWidth;
                    const currentSceneH = giftScene.offsetHeight; // 55vh
                    
                    const origSceneW = item.sceneW || 900;
                    const origSceneH = item.sceneH || 550;

                    const scaleX = currentSceneW / origSceneW;
                    const scaleY = currentSceneH / origSceneH;

                    let origLeft = (item.centerOffset !== undefined) ? (origSceneW / 2 + item.centerOffset) : (parseFloat(item.left) || 0);
                    let origTop = parseFloat(item.top) || 0;

                    wrapper.style.left = (origLeft * scaleX) + "px";
                    wrapper.style.top  = (origTop * scaleY) + "px";

                    if (item.width) wrapper.style.width = (parseFloat(item.width) * scaleX) + "px";
                    if (item.height && item.height !== "auto") wrapper.style.height = (parseFloat(item.height) * scaleY) + "px";
                    wrapper.style.zIndex = item.zIndex;
                    wrapper.style.transform = `rotate(${item.rotation || 0}deg) scaleX(${item.flip || 1})`;
                    renderGiftItemContents(wrapper, item, scaleX, scaleY);
                    giftScene.appendChild(wrapper);
                });
            }

            function renderGiftItemContents(wrapper, item, scaleX = 1, scaleY = 1) {
                if (item.type === "plushie" || item.type === "flower") {
                    const isBouquet = item.isBouquet === true || (item.src && item.src.startsWith("data:image")) || (item.image && item.image.startsWith("data:image"));
                    const img = document.createElement("img");
                    img.loading = 'lazy';
                    img.src = resolveMainSrc(item.src);
                    
                    const hasAccessories = item.accessories && item.accessories.length > 0;
                    if (isBouquet || item.canvasW !== undefined) {
                        img.style.position = "absolute";
                        img.style.width = "100%";
                        img.style.height = "100%";
                        img.style.objectFit = "contain";
                        img.style.left = "0";
                        img.style.top = "0";
                    } else if (hasAccessories) {
                        img.style.position = "relative";
                        img.style.width = "100%";
                        img.style.height = "auto";
                        img.style.display = "block";
                        wrapper.style.overflow = "visible";
                    } else {
                        img.style.position = "absolute";
                        img.style.width = "100%";
                        img.style.height = "auto";
                        img.style.left = "0";
                        img.style.top = "0";
                    }
                    img.draggable = false;
                    wrapper.appendChild(img);

                    if (item.accessories && item.accessories.length > 0) {
                        let canvasW = isBouquet ? 600 : 280;
                        let canvasH = canvasW;
                        let canvasL = isBouquet ? 0 : 210;
                        let canvasT = isBouquet ? 0 : 210;

                        if (item.canvasW !== undefined) {
                            canvasW = item.canvasW;
                            canvasH = item.canvasH;
                            canvasL = item.canvasL;
                            canvasT = item.canvasT;
                        }

                        item.accessories.forEach(acc => {
                            const accessory = document.createElement("img");
                            accessory.loading = 'lazy';
                            let src = acc.image;
                            if (src) src = resolveAccessorySrc(src);
                            accessory.src = src;
                            accessory.style.position = "absolute";
                            accessory.style.pointerEvents = "none";

                            const rawLeft = parseFloat(acc.left);
                            const rawTop = parseFloat(acc.top);
                            const rawWidth = parseFloat(acc.width);

                            let adjustedLeft = rawLeft;
                            let adjustedTop = rawTop;
                            if (item.canvasW === undefined && isBouquet) {
                                adjustedLeft = rawLeft - 50;
                                adjustedTop = rawTop - 50;
                            } else if (item.canvasW === undefined && !isBouquet) {
                                adjustedLeft = rawLeft - 210;
                                adjustedTop = rawTop - 210;
                            } else {
                                adjustedLeft = rawLeft - canvasL;
                                adjustedTop = rawTop - canvasT;
                            }
                            accessory.style.left = ((adjustedLeft / canvasW) * 100) + "%";
                            accessory.style.top = ((adjustedTop / canvasH) * 100) + "%";
                            accessory.style.width = ((rawWidth / canvasW) * 100) + "%";

                            if (item.accessories.indexOf(acc) === 0 && !isBouquet && item.canvasW !== undefined) {
                                accessory.style.height = "auto";
                                accessory.style.display = "block";
                            } else {
                                if (acc.height) {
                                    const rawHeight = parseFloat(acc.height);
                                    accessory.style.height = ((rawHeight / canvasH) * 100) + "%";
                                    accessory.style.objectFit = "contain";
                                } else if (isBouquet) {
                                    accessory.style.height = "auto";
                                    accessory.style.objectFit = "contain";
                                }
                            }

                            accessory.style.transform = `rotate(${acc.rotation || 0}deg) scaleX(${acc.flip || 1})`;
                            wrapper.appendChild(accessory);
                        });
                    }
                }
                else if (item.type === "note") {
                    const paper = document.createElement("img");
                    paper.loading = 'lazy';
                    paper.src = resolveMainSrc(item.src);
                    paper.style.width = "100%";
                    paper.style.display = "block";
                    paper.draggable = false;
                    wrapper.appendChild(paper);
                    wrapper.className = "note giftEl";

                    wrapper.style.containerType = "inline-size";
                    wrapper.style.aspectRatio = "1 / 1";

                    if (item.noteTextDetails) {
                        const textDiv = document.createElement("div");
                        textDiv.className = "noteText";
                        textDiv.style.position = "absolute";
                        textDiv.style.textAlign = "center";
                        textDiv.style.wordWrap = "break-word";
                        textDiv.style.userSelect = "none";

                        textDiv.innerText = item.noteTextDetails.text;
                        textDiv.style.fontFamily = item.noteTextDetails.fontFamily;
                        textDiv.style.color = item.noteTextDetails.color;

                        if (item.noteTextDetails.left !== undefined) {
                            textDiv.style.left = item.noteTextDetails.left + "%";
                            textDiv.style.top = item.noteTextDetails.top + "%";
                            textDiv.style.width = item.noteTextDetails.width ? (item.noteTextDetails.width + "%") : "60%";
                            let flipStr = item.noteTextDetails.flip == "-1" ? "scaleX(-1) " : "";
                            textDiv.style.transform = `translate(-50%, -50%) ${flipStr}rotate(${item.noteTextDetails.angle || 0}rad) scale(${item.noteTextDetails.scale || 1})`;
                            const savedHeight = item.noteTextDetails.height ? (item.noteTextDetails.height + "%") : "60%";
                            textDiv.style.height = savedHeight;
                            textDiv.style.overflow = "hidden";
                            textDiv.style.whiteSpace = "pre-wrap";
                            textDiv.style.wordBreak = "break-word";
                            textDiv.style.lineHeight = "1.2";
                            textDiv.style.fontSize = item.noteTextDetails.fontSize ? (item.noteTextDetails.fontSize + "cqw") : "3.8cqw";
                        } else {
                            textDiv.style.top = "20%";
                            textDiv.style.left = "20%";
                            textDiv.style.width = "60%";
                            textDiv.style.height = "60%";
                            textDiv.style.overflow = "hidden";
                            textDiv.style.fontSize = "18px";
                        }

                        wrapper.appendChild(textDiv);
                    }

                    if (item.stickers) {
                        item.stickers.forEach(st => {
                            const stickerImg = document.createElement("img");
                            stickerImg.loading = 'lazy';
                            stickerImg.src = resolveMainSrc(st.src);
                            stickerImg.style.position = "absolute";
                            stickerImg.style.left = st.left + "%";
                            stickerImg.style.top = st.top + "%";
                            stickerImg.style.width = st.width + "%";
                            stickerImg.style.transform = `translate(-50%, -50%) rotate(${st.angle || 0}rad) scale(${st.scale || 1})`;
                            stickerImg.style.pointerEvents = "none";
                            wrapper.appendChild(stickerImg);
                        });
                    }
                }
                else if (item.type === "sticker") {
                    const img = document.createElement("img");
                    img.loading = 'lazy';
                    img.src = resolveMainSrc(item.src);
                    img.style.width = "100%";
                    img.draggable = false;
                    wrapper.appendChild(img);
                }
                else if (item.type === "text") {
                    wrapper.className = "giftEl giftText";
                    wrapper.innerText = item.text;
                    wrapper.style.fontFamily = item.fontFamily;

                    let fs = parseFloat(item.fontSize) || 22;
                    wrapper.style.fontSize = (fs * scaleX) + "px";

                    wrapper.style.color = item.color;
                    wrapper.style.userSelect = "none";
                }
            }
        }
    </script>

    <script>
        // New Envelope Animation Logic
        const envelopeOverlay = document.getElementById("envelope-overlay");
        const envelopeFull = document.getElementById("envelopeFull");
        const envelopeParts = document.getElementById("envelopeParts");
        const envTop = document.getElementById("envTop");
        const envBottom = document.getElementById("envBottom");
        const envInstruction = document.getElementById("envInstruction");

        if (envelopeFull && envelopeOverlay) {
            let isOpening = false;
            
            function triggerOpen() {
                if (isOpening) return;
                isOpening = true;

                if (envInstruction) envInstruction.style.opacity = '0';

                // Subtle press feedback
                envelopeFull.style.transform = 'scale(0.97)';
                
                setTimeout(() => {
                    // Hide full envelope, show parts
                    envelopeFull.style.display = "none";
                    envelopeParts.style.display = "block";
                    
                    // Trigger reflow
                    void envelopeParts.offsetWidth;
                    
                    // Animate halves
                    envTop.classList.add("open");
                    envBottom.classList.add("open");
                    
                    // Fade out overlay
                    setTimeout(() => {
                        envelopeOverlay.classList.add("fading");
                        
                        // Remove completely
                        setTimeout(() => {
                            envelopeOverlay.remove();
                            document.body.classList.remove("env-opening");
                        }, 800);
                    }, 800);
                }, 150);
            }

            envelopeFull.addEventListener("click", triggerOpen);
            envelopeFull.addEventListener("touchend", (e) => {
                e.preventDefault();
                triggerOpen();
            });
        }
    </script>
