<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="color-scheme" content="light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Gift For You | The Gifting Co.</title>
    <link rel="icon" type="image/png" href="/assets/favicon.webp">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ribeye&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --toast-bg: #B71A3D;
            --heading-color: #B71A3D;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-image: url('/assets/giftbg.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #fef2f4;
        }

        .giftHeader {
            text-align: center !important;
            margin-top: 100px !important;
            margin-bottom: 20px !important;
            color: #B71A3D !important;
            font-family: 'Pinyon Script', cursive !important;
            font-size: 56px !important;
            text-shadow: 2px 2px 4px rgba(250, 197, 207, 0.4) !important;
            font-weight: bold !important;
            line-height: 1.2 !important;
        }

        @media (max-width: 768px) {
            body {
                background-image: url('/assets/mobilegiftbg.webp') !important;
                background-attachment: fixed !important;
                background-size: cover !important;
                height: 100vh !important;
                width: 100vw !important;
                overflow: hidden !important;
            }
            /* On mobile, the giftScene fills the full viewport so we can
               position items using absolute coords relative to the screen */
            #giftContainer {
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                gap: 0 !important;
            }
            #giftScene {
                position: absolute !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                flex: none !important;
            }
            .giftHeader {
                font-size: 48px !important;
                margin-top: 20px !important;
                margin-bottom: 10px !important;
                white-space: nowrap !important;
                position: relative;
                z-index: 20;
            }
        }

        /* Gift elements */
        .giftEl {
            position: absolute;
        }

        .giftText {
            min-width: 60px;
            font-size: 18px;
            color: #B71A3D;
            user-select: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .noteText {
            position: absolute;
            top: 12%;
            left: 10%;
            width: 75%;
            height: 70%;
            overflow: hidden;
            text-align: center;
            word-wrap: break-word;
            font-size: 18px;
            user-select: none;
        }




        /* Glass tile footer */
        .site-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 45px;
            padding: 0 20px;
            font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
            font-size: 12px;
            color: rgba(255, 220, 235, 0.85);
            width: 100%;
            box-sizing: border-box;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 9999;
            pointer-events: none;
            background: rgba(40, 5, 20, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .site-footer a {
            color: rgba(255, 200, 220, 0.95);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dotted rgba(255, 200, 220, 0.6);
            transition: opacity 0.2s ease;
            pointer-events: auto;
        }

        .site-footer a:hover { opacity: 0.7; }

        /* Loading state */
        #loadingMsg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            color: #B71A3D;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Title Header -->
    <h1 class="giftHeader">A Gift for You.</h1>

    <!-- Stationary gift layout exactly like gift.html -->
    <div id="giftContainer" style="display: flex; flex: 1; min-height: 0; align-items: center; gap: 20px; justify-content: center; width: 85%; max-width: 900px; margin: 0 auto; padding-top: 10px; padding-bottom: 20px; position: relative; z-index: 10;">
        <div id="giftScene" style="flex: 1; height: 55vh; position: relative; overflow: visible;">
            <!-- Arranged elements will be reconstructed here dynamically -->
        </div>
    </div>


    <!-- Glass tile footer -->
    <footer class="site-footer">&copy; 2026 | &#9825; Made with <a href="https://thegifting.vercel.app" target="_blank" rel="noopener noreferrer" style="margin-left: 4px;">The Gifting Co.</a></footer>

    <!-- Loading message -->
    <div id="loadingMsg">Loading your gift.</div>

    <script defer type="module">
        import { getGift } from './firebase-config.js';

        const giftScene = document.getElementById('giftScene');
        const loadingMsg = document.getElementById('loadingMsg');

        /* ---------- src helpers ---------- */
        function resolveMainSrc(src) {
            if (!src) return '';
            if (src.startsWith('data:')) return src;
            let path = src.replace(/\\/g, '/');
            const i = path.toLowerCase().indexOf('assets/');
            if (i !== -1) {
                const p = path.substring(i);
                return p.startsWith('/') ? '.' + p : './' + p;
            }
            return src;
        }

        function resolveAccessorySrc(src) {
            if (!src) return '';
            let path = src.replace(/\\/g, '/');
            const i = path.toLowerCase().indexOf('assets/');
            if (i !== -1) {
                const p = path.substring(i);
                return p.startsWith('/') ? '.' + p : './' + p;
            }
            const filename = path.split('/').pop();
            if (filename.includes('custom'))  return './assets/plushies/' + filename;
            if (filename.includes('flower')  || filename.includes('bow') || filename.includes('holder')) return './assets/flowers/' + filename;
            return './assets/' + filename;
        }

        /* ---------- load gift ---------- */
        let savedLayout = [];

        async function initViewer() {
            let docId = new URLSearchParams(window.location.search).get('id');
            if (!docId) {
                const parts = window.location.pathname.split('/');
                docId = parts[parts.length - 1];
            }
            if (!docId || docId === 'result.html' || docId === 'gift') {
                loadingMsg.textContent = 'Gift not found or invalid link.';
                return;
            }
            try {
                const giftData = await getGift(docId);
                    if (giftData) {
                    savedLayout = giftData.components || [];
                    loadingMsg.remove();
                    renderGift();
                } else {
                    loadingMsg.textContent = 'Gift not found!';
                }
            } catch (e) {
                console.error('Error loading gift:', e);
                loadingMsg.textContent = 'Error loading gift.';
            }
        }

        initViewer();

        /* ---------- render ---------- */
        function renderGift() {
            const isMobile = window.innerWidth <= 768;

            if (isMobile) {
                // === MOBILE PLACEMENT SNIPPET ===
                // Calculate the exact bow boundary on the mobile background (mobilegiftbg.webp = 941x1672)
                // using the same cover-scaling math as gift.html's updateBowBoundary.
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const imgW = 941, imgH = 1672;
                const imgRatio = imgW / imgH;
                const winRatio = vw / vh;

                let scaledW, scaledH, offsetX, offsetY;
                if (winRatio > imgRatio) {
                    // Window wider than image — image fills width, height is cropped
                    scaledW = vw;
                    scaledH = vw / imgRatio;
                    offsetX = 0;
                    offsetY = (vh - scaledH) / 2;
                } else {
                    // Window narrower — image fills height, width is cropped
                    scaledH = vh;
                    scaledW = vh * imgRatio;
                    offsetX = (vw - scaledW) / 2;
                    offsetY = 0;
                }

                // Exact bow centers from image analysis (px in original image):
                // Top=410, Bottom=1286, Left=148, Right=809  (image is 941x1672)
                const bowLeft   = offsetX + scaledW * (148 / imgW);
                const bowRight  = offsetX + scaledW * (809 / imgW);
                const bowTop    = offsetY + scaledH * (410 / imgH);
                const bowBottom = offsetY + scaledH * (1286 / imgH);

                const bowW = bowRight - bowLeft;   // usable width between bows
                const bowH = bowBottom - bowTop;   // usable height between bows
                const bowCX = bowLeft + bowW / 2;  // centre X of bow zone
                const bowCY = bowTop  + bowH / 2;  // centre Y of bow zone

                // The desktop gift scene is saved with coords relative to its own scene rect.
                // Find the bounding box of all items so we can centre them as a group.
                let minL = Infinity, minT = Infinity, maxR = -Infinity, maxB = -Infinity;
                savedLayout.forEach(item => {
                    const l = parseFloat(item.left) || 0;
                    const t = parseFloat(item.top)  || 0;
                    const w = parseFloat(item.width) || 100;
                    const h = parseFloat(item.height) || 100;
                    minL = Math.min(minL, l);
                    minT = Math.min(minT, t);
                    maxR = Math.max(maxR, l + w);
                    maxB = Math.max(maxB, t + h);
                });
                const groupW = maxR - minL || 1;
                const groupH = maxB - minT || 1;

                // Scale factor: fit the group into the bow zone (with a little padding)
                const pad = 0.85; // use 85% of the bow zone to leave breathing room
                const scale = Math.min((bowW * pad) / groupW, (bowH * pad) / groupH, 1);

                // Offset so the scaled group is centred on the bow zone centre
                const groupCX = (minL + maxR) / 2;
                const groupCY = (minT + maxB) / 2;

                savedLayout.forEach(item => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'giftEl';
                    wrapper.style.position = 'absolute';

                    const origL = parseFloat(item.left)  || 0;
                    const origT = parseFloat(item.top)   || 0;

                    // Translate relative to group centre, scale, then shift to bow centre
                    const newLeft = bowCX + (origL - groupCX) * scale;
                    const newTop  = bowCY + (origT - groupCY) * scale;

                    wrapper.style.left = newLeft + 'px';
                    wrapper.style.top  = newTop  + 'px';

                    if (item.width)  wrapper.style.width  = (parseFloat(item.width)  * scale) + 'px';
                    if (item.height && item.height !== 'auto') wrapper.style.height = (parseFloat(item.height) * scale) + 'px';
                    wrapper.style.zIndex = item.zIndex;
                    wrapper.style.transform = `rotate(${item.rotation || 0}deg) scaleX(${item.flip || 1})`;

                    renderGiftItemContents(wrapper, item, scale, scale);
                    giftScene.appendChild(wrapper);
                });
            } else {
                // === DESKTOP PLACEMENT SNIPPET ===
                savedLayout.forEach(item => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'giftEl';
                    wrapper.style.position = 'absolute';

                    const currentSceneW = giftScene.offsetWidth;
                    const currentSceneH = giftScene.offsetHeight; // 55vh
                    
                    const origSceneW = item.sceneW || 900;
                    const origSceneH = item.sceneH || 550;

                    const scaleX = currentSceneW / origSceneW;
                    const scaleY = currentSceneH / origSceneH;

                    let origLeft = (item.centerOffset !== undefined) ? (origSceneW / 2 + item.centerOffset) : (parseFloat(item.left) || 0);
                    let origTop = parseFloat(item.top) || 0;

                    wrapper.style.left = (origLeft * scaleX) + "px";
                    wrapper.style.top  = (origTop * scaleY) + "px";

                    if (item.width) wrapper.style.width = (parseFloat(item.width) * scaleX) + "px";
                    if (item.height && item.height !== "auto") wrapper.style.height = (parseFloat(item.height) * scaleY) + "px";
                    wrapper.style.zIndex = item.zIndex;
                    wrapper.style.transform = `rotate(${item.rotation || 0}deg) scaleX(${item.flip || 1})`;
                    renderGiftItemContents(wrapper, item, scaleX, scaleY);
                    giftScene.appendChild(wrapper);
                });
            }

            function renderGiftItemContents(wrapper, item, scaleX, scaleY) {
                /* ----- plushie or flower ----- */
                if (item.type === 'plushie' || item.type === 'flower') {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = resolveMainSrc(item.src);
                    img.style.position = 'absolute';
                    img.style.width = '100%';
                    img.style.height = 'auto';
                    img.style.left = '0';
                    img.style.top = '0';
                    img.draggable = false;
                    wrapper.appendChild(img);

                    if (item.accessories && item.accessories.length > 0) {
                        const isBouquet = item.isBouquet === true || (item.src && item.src.startsWith('data:image'));
                        const canvasW = isBouquet ? 600 : 280;
                        const canvasL = isBouquet ? 50 : 210;
                        const canvasT = isBouquet ? 50 : 210;

                        item.accessories.forEach(acc => {
                            const accessory = document.createElement('img');
                            accessory.loading = 'lazy';
                            accessory.src = resolveAccessorySrc(acc.image);
                            accessory.style.position = 'absolute';
                            accessory.style.pointerEvents = 'none';
                            const rawLeft  = parseFloat(acc.left);
                            const rawTop   = parseFloat(acc.top);
                            const rawWidth = parseFloat(acc.width);
                            accessory.style.left  = (((rawLeft - canvasL) / canvasW) * 100) + '%';
                            accessory.style.top   = (((rawTop  - canvasT) / canvasW) * 100) + '%';
                            accessory.style.width = ((rawWidth / canvasW) * 100) + '%';
                            accessory.style.transform = `rotate(${acc.rotation || 0}deg) scaleX(${acc.flip || 1})`;
                            wrapper.appendChild(accessory);
                        });
                    }

                }
                /* ----- note ----- */
                else if (item.type === 'note') {
                    const paper = document.createElement('img');
                    paper.loading = 'lazy';
                    paper.src = resolveMainSrc(item.src);
                    paper.style.width = '100%';
                    paper.style.display = 'block';
                    paper.draggable = false;
                    wrapper.appendChild(paper);
                    wrapper.className = 'note giftEl';

                    wrapper.style.containerType = "inline-size";
                    wrapper.style.overflow = "hidden";
                    wrapper.style.aspectRatio = "1 / 1";
                    wrapper.style.height = wrapper.style.width;

                    if (item.noteTextDetails) {
                        const textDiv = document.createElement('div');
                        textDiv.className = 'noteText';
                        textDiv.style.position = 'absolute';
                        textDiv.style.textAlign = 'center';
                        textDiv.style.wordWrap = 'break-word';
                        textDiv.style.userSelect = 'none';

                        textDiv.innerText = item.noteTextDetails.text;
                        textDiv.style.fontFamily = item.noteTextDetails.fontFamily;
                        textDiv.style.color = item.noteTextDetails.color;

                        if (item.noteTextDetails.left !== undefined) {
                            textDiv.style.left = item.noteTextDetails.left + "%";
                            textDiv.style.top = item.noteTextDetails.top + "%";
                            textDiv.style.width = item.noteTextDetails.width ? (item.noteTextDetails.width + "%") : "75%";
                            let flipStr = item.noteTextDetails.flip == "-1" ? "scaleX(-1) " : "";
                            textDiv.style.transform = `translate(-50%, -50%) ${flipStr}rotate(${item.noteTextDetails.angle || 0}rad) scale(${item.noteTextDetails.scale || 1})`;
                            const savedHeight = item.noteTextDetails.height ? (item.noteTextDetails.height + "%") : "45%";
                            textDiv.style.height = savedHeight;
                            textDiv.style.overflow = "hidden";
                            textDiv.style.whiteSpace = "pre-wrap";
                            textDiv.style.wordBreak = "break-word";
                            textDiv.style.lineHeight = "1.2";
                            textDiv.style.fontSize = item.noteTextDetails.fontSize ? (item.noteTextDetails.fontSize + "cqw") : "7.5cqw";
                        } else {
                            textDiv.style.top = "12%";
                            textDiv.style.left = "10%";
                            textDiv.style.width = "75%";
                            textDiv.style.height = "70%";
                            textDiv.style.overflow = "hidden";
                            textDiv.style.fontSize = "18px";
                        }

                        wrapper.appendChild(textDiv);
                    }

                    if (item.stickers) {
                        item.stickers.forEach(st => {
                            const stickerImg = document.createElement("img");
                            stickerImg.src = resolveMainSrc(st.src);
                            stickerImg.style.position = "absolute";
                            stickerImg.style.left = st.left + "%";
                            stickerImg.style.top = st.top + "%";
                            stickerImg.style.width = st.width + "%";
                            stickerImg.style.transform = `translate(-50%, -50%) rotate(${st.angle || 0}rad) scale(${st.scale || 1})`;
                            stickerImg.style.pointerEvents = "none";
                            wrapper.appendChild(stickerImg);
                        });
                    }
                }
                /* ----- sticker ----- */
                else if (item.type === 'sticker') {
                    const img = document.createElement('img');
                    img.loading = 'lazy';
                    img.src = resolveMainSrc(item.src);
                    img.style.width = '100%';
                    img.draggable = false;
                    wrapper.appendChild(img);
                }
                /* ----- text ----- */
                else if (item.type === 'text') {
                    wrapper.className = 'giftEl giftText';
                    wrapper.innerText = item.text;
                    wrapper.style.fontFamily = item.fontFamily;
                    wrapper.style.fontSize   = item.fontSize;
                    wrapper.style.color      = item.color;
                    wrapper.style.userSelect = 'none';
                }

            }
        }
    </script>
</body>
</html>
