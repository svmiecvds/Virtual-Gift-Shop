<!DOCTYPE html>
<html>
<head>
<style>
  .note {
    position: absolute;
    width: 220px;
    height: auto;
    aspect-ratio: 1 / 1;
    background: yellow;
    container-type: inline-size;
  }
  .textDiv {
    position: absolute;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    width: 62%;
    height: 45%;
    background: rgba(255,0,0,0.5);
  }
</style>
</head>
<body>
  <div class="note" id="n1">
    <div class="textDiv">aspect-ratio only (auto height)</div>
  </div>
  <div class="note" id="n2" style="left: 250px; height: 220px;">
    <div class="textDiv">explicit height</div>
  </div>
</body>
</html>
